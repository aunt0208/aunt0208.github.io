<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linky 試作">
<title>Linky｜タスクとゴール 試作</title>
<style>
:root{--bg:#f6f8f7;--surface:#fff;--ink:#263b34;--muted:#788881;--edge:#e3e9e5;--green:#397762;--dark:#245641;--tint:#ecf4ef;--shadow:0 16px 42px rgba(27,62,47,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.5}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8fbeab;outline-offset:2px}svg{display:block} .icon{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:980px;margin:0 auto;padding:0 24px 115px}.appbar{height:85px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--edge);background:rgba(255,255,255,.8);backdrop-filter:blur(18px)}.appbar-in{max-width:980px;padding:0 24px;width:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-size:20px;letter-spacing:-.5px;font-weight:800}.mark{background:var(--green);color:white;border-radius:12px;width:36px;height:36px;display:grid;place-items:center}.brand small{display:block;font-size:9px;letter-spacing:2px;color:var(--muted);font-weight:700}.round-btn{height:40px;width:40px;border:1px solid var(--edge);border-radius:13px;display:grid;place-items:center;background:white;color:var(--ink)}.primary{background:var(--green);color:#fff;border:1px solid var(--green);border-radius:12px;padding:12px 17px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}.primary:hover{background:var(--dark)}.secondary{background:#fff;border:1px solid var(--edge);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700}.link{background:transparent;border:0;color:var(--green);font-weight:700;padding:7px 0}.muted{color:var(--muted)}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:42px 0 18px}.eyebrow{margin:0 0 6px;font-size:11px;letter-spacing:1.8px;color:var(--green);font-weight:800}.heading h1{font-size:30px;letter-spacing:-1px;margin:0}.heading .subtitle{font-size:13px;color:var(--muted);margin:5px 0 0}.count{display:inline-block;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}.filter{position:relative}.filter button{background:white;border:1px solid var(--edge);color:var(--ink);padding:10px 12px;border-radius:12px;font-size:12px;font-weight:650;display:flex;gap:9px;align-items:center}.filter button.active{background:var(--tint);border-color:#bbd4c4;color:var(--dark)}.filter .arrow{margin-left:7px}.filter-menu{position:absolute;z-index:10;top:45px;left:0;background:white;border:1px solid var(--edge);border-radius:16px;min-width:236px;max-width:80vw;box-shadow:var(--shadow);padding:7px}.filter-menu button{display:flex;width:100%;text-align:left;border:0;padding:12px;border-radius:10px;background:transparent;white-space:normal}.filter-menu button:hover{background:var(--bg)}.filter-menu hr{margin:6px 4px;border:0;border-top:1px solid var(--edge)}.small-action{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--muted);font-size:12px;font-weight:700}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:14px}.zone{background:white;border:1px solid var(--edge);border-radius:18px;padding:16px;min-height:214px;box-shadow:0 4px 14px rgba(24,54,42,.025)}.zone-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:25px}.zone-dot{width:8px;height:8px;border-radius:50%;background:#83ada0}.zone.tm .zone-dot{background:#43866b}.zone.lm .zone-dot{background:#789aaf}.zone.to .zone-dot{background:#bb9d72}.zone.lo .zone-dot{background:#aaafb1}.zone-title{font-weight:750;font-size:14px}.zone-count{font-size:11px;color:var(--muted);margin-left:auto;font-weight:650}.task-list{display:flex;flex-direction:column;gap:9px}.task{background:#f9faf9;border:1px solid #eef2ef;border-radius:12px;display:flex;align-items:flex-start;gap:9px;padding:11px 10px;min-height:48px}.task .complete{width:18px;height:18px;border-radius:6px;border:1.5px solid #a0b1a9;background:white;display:grid;place-items:center;color:white;flex:none;margin:2px 0 0;padding:0}.task .complete.checked{background:var(--green);border-color:var(--green)}.task .complete .icon{width:12px;height:12px}.task-content{min-width:0;flex:1}.task-title{font-size:13px;font-weight:650;line-height:1.43;word-break:break-word;display:block;text-align:left;border:0;background:none;padding:0;color:var(--ink);width:100%}.task.done .task-title{text-decoration:line-through;color:#99a6a0}.task-goals{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.goal-tag{font-size:10px;line-height:1.25;color:#47846e;background:#e9f3ed;border-radius:5px;border:0;display:inline-flex;align-items:center;gap:3px;padding:3px 5px;min-width:0;max-width:100%;text-align:left}.goal-tag .icon{width:11px;height:11px}.goal-tag span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}.zone-empty{font-size:12px;text-align:center;color:#a0ada6;padding:37px 6px;line-height:1.5}.zone-add{margin-top:12px;width:100%;text-align:center;border:1px dashed #d8e5de;border-radius:9px;padding:7px;background:transparent;color:var(--green);font-size:12px;font-weight:700}.footer-note{font-size:11px;color:#8b9a92;margin-top:17px;text-align:center}.done-panel{margin:16px 0 0;border:1px solid var(--edge);border-radius:14px;background:white;overflow:hidden}.done-toggle{width:100%;border:0;background:white;text-align:left;padding:13px 16px;color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center;font-weight:700}.done-rows{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty-goals{margin:26px 0;font-size:13px;color:var(--muted)}
.fab{position:fixed;z-index:5;right:max(23px,calc((100vw - 980px)/2 + 23px));bottom:26px;bottom:max(26px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:7px;background:var(--green);border:0;border-radius:22px;padding:15px 18px;color:#fff;box-shadow:0 10px 25px rgba(40,112,80,.25);font-size:13px;font-weight:800}.fab .icon{width:20px;height:20px}.overlay{position:fixed;inset:0;background:rgba(23,37,30,.33);z-index:20;display:flex;justify-content:center;align-items:flex-end;padding:14px}.sheet{width:100%;max-width:500px;max-height:min(90dvh,850px);overflow:hidden;display:flex;flex-direction:column;background:white;border-radius:22px;box-shadow:0 25px 75px rgba(0,0,0,.17);animation:up .2s ease}.sheet-header{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:19px 20px;border-bottom:1px solid var(--edge)}.sheet-header h2{margin:0;font-size:17px;letter-spacing:-.3px}.sheet-body{overflow:auto;padding:20px;flex:1;overscroll-behavior:contain}.sheet-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-top:1px solid var(--edge);padding-bottom:max(15px,env(safe-area-inset-bottom))}.sheet-footer button{flex:1}.form-field{margin:0 0 18px}.label{font-size:12px;font-weight:750;color:var(--ink);display:block;margin:0 0 8px}.input,.textarea{width:100%;padding:12px;border:1px solid #dbe4de;background:white;border-radius:11px;color:var(--ink);font-size:15px}.textarea{resize:vertical;min-height:74px;font-size:13px}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices{display:flex;border:1px solid var(--edge);border-radius:10px;padding:3px;background:var(--bg);gap:4px}.choices label{flex:1;min-width:0}.choices input{position:absolute;opacity:0;width:1px;height:1px}.choices label span{display:block;text-align:center;padding:9px 2px;font-size:12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:750}.choices input:checked+span{background:var(--surface);box-shadow:0 1px 5px rgba(0,0,0,.065);color:var(--green)}.goal-select{display:flex;gap:8px;flex-wrap:wrap}.goal-select label{position:relative}.goal-select input{position:absolute;opacity:0}.goal-select span{display:inline-block;border:1px solid #d6e3da;border-radius:9px;padding:9px 10px;font-size:12px;color:var(--muted);font-weight:650;cursor:pointer}.goal-select input:checked+span{background:var(--tint);border-color:#b8d4c0;color:var(--dark)}.goal-select input:focus-visible+span{outline:2px solid var(--green)}.split{display:flex;justify-content:space-between;gap:8px;align-items:center}.tiny-note{font-size:11px;color:var(--muted);margin:8px 0 0}.subtle-button{background:none;border:0;color:var(--green);font-size:12px;padding:5px 0;font-weight:750}.danger{color:#b35351;background:transparent;border:0;padding:8px;font-size:12px}.goal-card-summary{background:var(--tint);padding:17px;border-radius:13px;margin-bottom:16px}.goal-card-summary .title{font-size:18px;font-weight:800;margin-bottom:4px}.goal-card-summary .desc{font-size:12px;color:#587569}.progress-track{height:6px;background:#d7e5dc;border-radius:9px;overflow:hidden;margin:12px 0 6px}.progress-inner{background:var(--green);height:100%;border-radius:9px}.goal-status{font-size:11px;color:var(--muted)}.goal-associated{display:flex;flex-direction:column;gap:9px}.associated-row{padding:9px 10px;background:#f8faf8;border:1px solid var(--edge);border-radius:9px;font-size:12px}.goal-detail-actions{display:flex;gap:8px;margin-top:15px}.goal-detail-actions button{flex:1}.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:92px;background:#2e4e41;color:white;padding:10px 15px;border-radius:11px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}@keyframes up{from{transform:translateY(20px);opacity:.7}to{transform:translateY(0);opacity:1}}.hint-banner{background:#f0f5f1;border-radius:11px;padding:12px;font-size:12px;color:#61786c;margin-bottom:15px}
@media(max-width:600px){.wrap{padding:0 12px 110px}.appbar{height:67px}.appbar-in{padding:0 14px}.heading{margin:27px 4px 18px}.heading h1{font-size:24px}.heading .subtitle{font-size:11px}.matrix{gap:9px}.zone{border-radius:14px;padding:10px 8px;min-height:171px}.zone-title{font-size:12px}.zone-head{gap:6px;margin-bottom:10px}.zone-count{font-size:10px}.task-list{gap:6px}.task{border-radius:9px;padding:9px 6px;gap:6px}.task-title{font-size:12px}.task .complete{width:17px;height:17px}.goal-tag{max-width:100%;font-size:9px}.goal-tag span{max-width:115px}.zone-add{font-size:11px}.done-rows{grid-template-columns:1fr}.fab{bottom:max(19px,env(safe-area-inset-bottom));right:17px}.footer-note{margin:17px 4px;font-size:10px}.sheet{max-height:94dvh;border-radius:19px 19px 13px 13px}.overlay{padding:0}.two-cols{gap:8px}}@media(max-width:350px){.zone-dot{display:none}.zone-title{font-size:11px}.task-title{font-size:11px}.goal-tag span{max-width:95px}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
<symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
</svg>
<header class="appbar"><div class="appbar-in"><div class="brand"><span class="mark"><svg class="icon"><use href="#i-list"/></svg></span><span>Linky <small>TASK MATRIX · PROTOTYPE</small></span></div><button class="round-btn" data-act="add-task" aria-label="タスクを追加"><svg class="icon"><use href="#i-plus"/></svg></button></div></header>
<main id="app" class="wrap"></main>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
(()=>{'use strict';
const STORE='linky-matrix-goals-preview-v1';
const seed=()=>({goals:[{id:'g1',title:'アプリを公開する',description:'試作から公開まで進める',done:false},{id:'g2',title:'SNSで認知を増やす',description:'制作の取り組みを継続的に伝える',done:false}],tasks:[{id:'t1',title:'動作確認をする',when:'today',importance:'must',goalIds:['g1'],done:false,note:'',due:''},{id:'t2',title:'牛乳を買う',when:'today',importance:'must',goalIds:[],done:false,note:'',due:''},{id:'t3',title:'紹介動画を作る',when:'later',importance:'must',goalIds:['g1','g2'],done:false,note:'',due:''},{id:'t4',title:'SNSに投稿する',when:'today',importance:'optional',goalIds:['g2'],done:false,note:'',due:''},{id:'t5',title:'参考資料を整理する',when:'later',importance:'optional',goalIds:[],done:false,note:'',due:''} ]});
let state;try{const saved=JSON.parse(localStorage.getItem(STORE));state=saved&&Array.isArray(saved.tasks)&&Array.isArray(saved.goals)?saved:seed()}catch{state=seed()}
let selectedGoal=null,filterOpen=false,modal=null,doneExpanded=false,toastTimer;
const zones=[{key:'tm',name:'今日・必須',when:'today',importance:'must'},{key:'lm',name:'後日・必須',when:'later',importance:'must'},{key:'to',name:'今日・任意',when:'today',importance:'optional'},{key:'lo',name:'後日・保留',when:'later',importance:'optional'}];
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const goal=id=>state.goals.find(g=>g.id===id),task=id=>state.tasks.find(t=>t.id===id);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{toast('ブラウザで保存できませんでした')}}
function toast(message){const el=document.getElementById('toast-root');el.innerHTML=`<div role="status" class="toast">${h(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',2200)}
function tags(t){let ids=(t.goalIds||[]).filter(id=>goal(id));if(!ids.length)return '';return `<div class="task-goals">${ids.slice(0,2).map(id=>`<button class="goal-tag" type="button" data-act="goal-info" data-id="${h(id)}" title="${h(goal(id).title)}">${svg('target')}<span>${h(goal(id).title)}</span></button>`).join('')}${ids.length>2?`<span class="goal-tag">+${ids.length-2}</span>`:''}</div>`}
function taskEl(t){return `<div class="task ${t.done?'done':''}"><button class="complete ${t.done?'checked':''}" data-act="toggle-task" data-id="${h(t.id)}" aria-label="${h(t.title)}を${t.done?'未完了に戻す':'完了にする'}">${t.done?svg('check'):''}</button><div class="task-content"><button type="button" class="task-title" data-act="edit-task" data-id="${h(t.id)}">${h(t.title)}</button>${tags(t)}</div></div>`}
function render(){const active=state.tasks.filter(t=>!t.done&&(!selectedGoal||(t.goalIds||[]).includes(selectedGoal))),complete=state.tasks.filter(t=>t.done&&(!selectedGoal||(t.goalIds||[]).includes(selectedGoal)));const selected=goal(selectedGoal);let html=`<div class="heading"><div><p class="eyebrow">TASK MANAGER</p><h1>タスク管理</h1><p class="subtitle">タスクが主役。ゴールはその下に、さりげなく。</p></div><span class="count">未完了 ${active.length}件</span></div><div class="controls"><div class="filter"><button type="button" class="${selected?'active':''}" data-act="filter-toggle">${svg('target')}${selected?h(selected.title):'すべてのタスク'}${svg('chevron')}</button>${filterOpen?`<div class="filter-menu"><button data-act="select-goal" data-id="">すべてのタスク</button>${state.goals.map(g=>`<button data-act="select-goal" data-id="${h(g.id)}">${svg('target')}${h(g.title)}</button>`).join('')}<hr><button data-act="add-goal">${svg('plus')}ゴールを作成</button></div>`:''}</div><button class="small-action" data-act="add-goal">${svg('plus')}ゴール作成</button></div><section class="matrix" aria-label="タスクの4象限マトリクス">`;
for(const z of zones){let ts=active.filter(t=>t.when===z.when&&t.importance===z.importance);html+=`<section class="zone ${z.key}"><header class="zone-head"><span class="zone-dot"></span><span class="zone-title">${z.name}</span><span class="zone-count">${ts.length}</span></header><div class="task-list">${ts.length?ts.map(taskEl).join(''):'<div class="zone-empty">タスクなし</div>'}</div><button class="zone-add" data-act="add-task" data-zone="${z.key}">＋ タスクを追加</button></section>`}html+=`</section>`;
if(complete.length)html+=`<section class="done-panel"><button class="done-toggle" data-act="toggle-done">${doneExpanded?'▾':'▸'} 完了したタスク ${complete.length}件</button>${doneExpanded?`<div class="done-rows">${complete.map(taskEl).join('')}</div>`:''}</section>`;
html+=`<p class="footer-note">ゴールのないタスクは、今までどおり1行で表示されます。</p><button class="fab" data-act="add-task">${svg('plus')}タスク追加</button>`;document.getElementById('app').innerHTML=html;renderModal()}
function openModal(type,id=null,zone=null){filterOpen=false;modal={type,id,zone};render()}
function closeModal(){modal=null;render()}
function radio(name,options,value){return `<div class="choices">${options.map(([v,label])=>`<label><input type="radio" name="${name}" value="${v}" ${value===v?'checked':''}><span>${label}</span></label>`).join('')}</div>`}
function renderModal(){const root=document.getElementById('modal-root');if(!modal){root.innerHTML='';return}let content='',title='',footer='';
if(modal.type==='task'){const current=task(modal.id);const z=zones.find(x=>x.key===modal.zone);title=current?'タスクを編集':'タスクを追加';const when=current?.when||z?.when||'today', importance=current?.importance||z?.importance||'must';const selected=[...(current?.goalIds||[]),...(modal.initialGoal?[modal.initialGoal]:[])].filter((x,i,a)=>goal(x)&&a.indexOf(x)===i);content=`<form id="task-form"><div class="form-field"><label class="label" for="task-title">タスク名</label><input class="input" id="task-title" name="title" placeholder="やることを入力" value="${h(current?.title||'')}" maxlength="120" required></div><div class="two-cols"><div class="form-field"><label class="label">いつ？</label>${radio('when',[['today','今日'],['later','後日']],when)}</div><div class="form-field"><label class="label">必須？</label>${radio('importance',[['must','必須'],['optional','任意']],importance)}</div></div><div class="form-field"><div class="split"><label class="label">関連ゴール（任意）</label><button type="button" class="subtle-button" data-act="add-goal-from-task">＋ 作成</button></div><div class="goal-select">${state.goals.length?state.goals.map(g=>`<label><input type="checkbox" name="goalIds" value="${h(g.id)}" ${selected.includes(g.id)?'checked':''}><span>${h(g.title)}</span></label>`).join(''):'<span class="tiny-note">まだゴールはありません</span>'}</div><p class="tiny-note">設定しなくてもタスクは保存できます。複数選択もできます。</p></div><details ${current?.note||current?.due?'open':''}><summary class="label">詳細を設定（任意）</summary><div class="form-field"><label class="label">期限</label><input class="input" name="due" type="date" value="${h(current?.due||'')}"></div><div class="form-field"><label class="label">メモ</label><textarea class="textarea" name="note" placeholder="補足があれば入力">${h(current?.note||'')}</textarea></div></details></form>`;footer=`${current?`<button class="danger" data-act="delete-task" data-id="${h(current.id)}">削除</button>`:''}<button type="submit" form="task-form" class="primary">${current?'保存する':'追加する'}</button>`}
else if(modal.type==='goal-form'){const current=goal(modal.id);title=current?'ゴールを編集':'ゴールを作成';content=`<form id="goal-form"><div class="form-field"><label class="label">ゴール名</label><input class="input" name="title" placeholder="例：アプリを公開する" maxlength="90" required value="${h(current?.title||'')}"></div><div class="form-field"><label class="label">達成条件やメモ（任意）</label><textarea class="textarea" name="description" placeholder="どの状態になったら達成？">${h(current?.description||'')}</textarea></div><p class="tiny-note">ゴールはタスクに関連付けるためのラベルとして使えます。達成状態は手動で管理します。</p></form>`;footer=`${current?`<button class="danger" data-act="delete-goal" data-id="${h(current.id)}">削除</button>`:''}<button class="primary" form="goal-form" type="submit">${current?'保存する':'作成する'}</button>`}
else if(modal.type==='goal-info'){const g=goal(modal.id);if(!g){modal=null;root.innerHTML='';return}title='ゴールの詳細';const ts=state.tasks.filter(t=>(t.goalIds||[]).includes(g.id)),finished=ts.filter(t=>t.done).length,percent=ts.length?Math.round(finished/ts.length*100):0;content=`<div class="goal-card-summary"><div class="title">${h(g.title)}</div><div class="desc">${h(g.description||'達成したいこと')}</div><div class="progress-track"><div class="progress-inner" style="width:${percent}%"></div></div><div class="goal-status">タスク ${finished}/${ts.length}件完了 · ゴールは${g.done?'達成済み':'未達成'}</div></div><div class="form-field"><label class="label">関連タスク</label><div class="goal-associated">${ts.length?ts.map(t=>`<div class="associated-row">${t.done?'✓　':'○　'}${h(t.title)}</div>`).join(''):'<div class="empty-goals">まだタスクはありません</div>'}</div></div><div class="goal-detail-actions"><button type="button" class="secondary" data-act="filter-from-detail" data-id="${h(g.id)}">このゴールで絞り込む</button><button type="button" class="secondary" data-act="edit-goal" data-id="${h(g.id)}">編集</button></div>`;footer=`<button class="secondary" data-act="toggle-goal" data-id="${h(g.id)}">${g.done?'未達成に戻す':'ゴールを達成済みにする'}</button><button class="primary" data-act="add-task-to-goal" data-id="${h(g.id)}">＋ タスク追加</button>`}
root.innerHTML=`<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="${h(title)}"><div class="sheet-header"><h2>${h(title)}</h2><button type="button" class="round-btn" data-act="close-modal" aria-label="閉じる">${svg('x')}</button></div><div class="sheet-body">${content}</div><div class="sheet-footer">${footer}</div></div></div>`;
}
function trigger(action,id,zone){switch(action){case'add-task':openModal('task',null,zone);break;case'edit-task':openModal('task',id);break;case'goal-info':openModal('goal-info',id);break;case'close-modal':closeModal();break;case'toggle-task':{const t=task(id);if(t){t.done=!t.done;save();render();toast(t.done?'完了しました':'未完了に戻しました')}break}case'filter-toggle':filterOpen=!filterOpen;render();break;case'select-goal':selectedGoal=id||null;filterOpen=false;render();break;case'add-goal':openModal('goal-form');break;case'edit-goal':openModal('goal-form',id);break;case'toggle-done':doneExpanded=!doneExpanded;render();break;case'filter-from-detail':selectedGoal=id;closeModal();break;case'toggle-goal':{const g=goal(id);if(g){g.done=!g.done;save();openModal('goal-info',id);toast(g.done?'ゴールを達成済みにしました':'未達成に戻しました')}break}case'add-task-to-goal':{const g=goal(id);if(g){modal={type:'task',id:null,zone:null,initialGoal:g.id};render()}break}case'delete-task':{if(!confirm('このタスクを削除しますか？'))break;state.tasks=state.tasks.filter(t=>t.id!==id);save();closeModal();toast('削除しました');break}case'delete-goal':{if(!confirm('このゴールを削除しますか？ 関連タスクは残ります。'))break;state.goals=state.goals.filter(g=>g.id!==id);state.tasks.forEach(t=>t.goalIds=(t.goalIds||[]).filter(i=>i!==id));if(selectedGoal===id)selectedGoal=null;save();closeModal();toast('削除しました');break}case'add-goal-from-task':{const f=document.getElementById('task-form');if(f){const draft={title:f.elements.title.value,when:f.querySelector('input[name=when]:checked')?.value||'today',importance:f.querySelector('input[name=importance]:checked')?.value||'must',goalIds:[...f.querySelectorAll('[name=goalIds]:checked')].map(e=>e.value),note:f.elements.note?.value||'',due:f.elements.due?.value||''};const text=prompt('新しいゴール名を入力');if(text?.trim()){const id=uid('g');state.goals.push({id,title:text.trim(),description:'',done:false});save();openModal('task',modal.id,modal.zone);const target=document.getElementById('task-form');if(target){target.elements.title.value=draft.title;target.querySelector(`input[name=when][value="${draft.when}"]`).checked=true;target.querySelector(`input[name=importance][value="${draft.importance}"]`).checked=true;target.elements.note.value=draft.note;target.elements.due.value=draft.due;[...draft.goalIds,id].forEach(gid=>{const x=[...target.querySelectorAll('[name=goalIds]')].find(x=>x.value===gid);if(x)x.checked=true})}toast('ゴールを作成しました')}}break}}
}
document.addEventListener('click',e=>{const act=e.target.closest('[data-act]');if(act){trigger(act.dataset.act,act.dataset.id,act.dataset.zone);return}if(e.target.id==='overlay')closeModal();else if(filterOpen&&!e.target.closest('.filter')){filterOpen=false;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='task-form'){e.preventDefault();const fd=new FormData(e.target),title=String(fd.get('title')||'').trim();if(!title)return;const obj={id:modal.id||uid('t'),title,when:fd.get('when')||'today',importance:fd.get('importance')||'must',goalIds:fd.getAll('goalIds').map(String),done:task(modal.id)?.done||false,note:String(fd.get('note')||''),due:String(fd.get('due')||'')};if(modal.initialGoal&&!obj.goalIds.includes(modal.initialGoal))obj.goalIds.push(modal.initialGoal);const i=state.tasks.findIndex(t=>t.id===obj.id);if(i>=0)state.tasks[i]=obj;else state.tasks.unshift(obj);save();closeModal();toast(i>=0?'タスクを保存しました':'タスクを追加しました')}else if(e.target.id==='goal-form'){e.preventDefault();const fd=new FormData(e.target),title=String(fd.get('title')||'').trim();if(!title)return;const current=goal(modal.id);if(current){current.title=title;current.description=String(fd.get('description')||'')}else state.goals.push({id:uid('g'),title,description:String(fd.get('description')||''),done:false});save();closeModal();toast(current?'ゴールを保存しました':'ゴールを作成しました')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
render();
})();
</script>
</body>
</html>
