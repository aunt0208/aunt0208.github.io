<script>
(()=>{'use strict';
const KEY='goalpath-ux-prototype-v1';
const fresh=()=>({goals:[],objectives:[],tasks:[],goalOrders:{}});
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const demo=()=>({goals:[{id:'g1',title:'自分のアプリを公開する',description:'',deadline:'',status:'active'},{id:'g2',title:'SNSで認知を増やす',description:'',deadline:'',status:'active'}],objectives:[{id:'o1',title:'試作品を完成させる',goalIds:['g1'],status:'active'},{id:'o2',title:'利用者の声を集める',goalIds:['g1','g2'],status:'active'}],tasks:[{id:'t1',title:'動作確認をする',goalIds:[],objectiveIds:['o1'],when:'today',importance:'must',done:false,note:'',dueDate:'',plannedDate:'',checklist:[]},{id:'t2',title:'3人に使ってもらう',goalIds:[],objectiveIds:['o2'],when:'later',importance:'must',done:false,note:'',dueDate:'',plannedDate:'',checklist:[]},{id:'t3',title:'紹介動画を作る',goalIds:['g2'],objectiveIds:['o2'],when:'today',importance:'optional',done:false,note:'',dueDate:'',plannedDate:'',checklist:[]}],goalOrders:{g1:['t1','t2','t3'],g2:['t3','t2']}});
function normalize(x){if(!x||!Array.isArray(x.goals)||!Array.isArray(x.tasks)||!Array.isArray(x.objectives))return null;return {...x,goalOrders:x.goalOrders&&typeof x.goalOrders==='object'?x.goalOrders:{}};}
function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)))||fresh()}catch(e){return fresh()}}
let data=load();let ui={page:'home',goalId:null,taskMode:'list',filter:'all',showDone:false,addingGoal:null,sheet:null};let toastTimer=0,undo=null;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(name,c='')=>'<svg class="icon '+c+'" aria-hidden="true"><use href="#i-'+name+'"></use></svg>';
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const findGoal=id=>data.goals.find(x=>x.id===id);const findObj=id=>data.objectives.find(x=>x.id===id);const findTask=id=>data.tasks.find(x=>x.id===id);
const goalIds=t=>[...new Set([...(t.goalIds||[]),...(t.objectiveIds||[]).flatMap(id=>findObj(id)?.goalIds||[])])].filter(id=>!!findGoal(id));
const goalTasks=id=>data.tasks.filter(t=>goalIds(t).includes(id));
function queue(id){const tasks=goalTasks(id),order=data.goalOrders[id]||[];return [...tasks].sort((a,b)=>{const ai=order.indexOf(a.id),bi=order.indexOf(b.id);return (ai<0?100000+data.tasks.indexOf(a):ai)-(bi<0?100000+data.tasks.indexOf(b):bi)})}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(err){toast('ブラウザに保存できませんでした')}}
function toast(message,undoAction=false){let node=document.getElementById('toast');node.innerHTML='<span>'+e(message)+'</span>'+(undoAction?'<button data-act="undo">元に戻す</button>':'');node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{node.classList.remove('show');undo=null},4500)}
function taskObj(t){return (t.objectiveIds||[]).map(id=>findObj(id)?.title).filter(Boolean)}
function addTask(title,{goalId=null,objId=null}={}){let t={id:uid('t'),title:title.trim(),goalIds:goalId?[goalId]:[],objectiveIds:objId?[objId]:[],done:false,when:'',importance:'',plannedDate:'',dueDate:'',note:'',checklist:[]};data.tasks.push(t);if(goalId){data.goalOrders[goalId]||=[];data.goalOrders[goalId].push(t.id)}persist();return t}
function checkButton(t){return '<button class="check '+(t.done?'done':'')+'" data-act="toggle-task" data-id="'+e(t.id)+'" aria-label="'+e((t.done?'未完了に戻す: ':'完了する: ')+t.title)+'">'+ic('check','sm')+'</button>'}
function goalCard(g){let tasks=queue(g.id),next=tasks.find(t=>!t.done),completed=tasks.filter(t=>t.done).length;let adding=ui.addingGoal===g.id;return '<article class="goal-card" data-card="'+e(g.id)+'"><div class="goal-header"><div style="min-width:0;flex:1"><button class="goal-title" data-act="open-goal" data-id="'+e(g.id)+'">'+e(g.title)+'</button><p class="goal-desc">'+(tasks.length?e(tasks.length-completed)+'件のタスクが残っています':'タスクを追加して始めましょう')+'</p></div>'+(g.status==='done'?'<span class="goal-status">達成済み</span>':'')+'</div>'+
(next?'<div class="goal-next"><div class="next-eyebrow">'+ic('next','sm')+' 次にやること</div><div class="next-row">'+checkButton(next)+'<div style="min-width:0"><button class="task-name" data-act="edit-task" data-id="'+e(next.id)+'">'+e(next.title)+'</button>'+(taskObj(next).length?'<p class="tiny-objective">'+e(taskObj(next)[0])+'</p>':'')+'</div></div></div>':tasks.length?'<div class="goal-next celebrate">'+ic('check','sm')+' 登録したタスクはすべて完了しました</div>':'<div class="quiet-empty">最初の1件を登録してみましょう。</div>')+
'<div class="goal-progress"><div class="bar"><span style="width:'+(tasks.length?Math.round(completed/tasks.length*100):0)+'%"></span></div><span class="subtle">'+completed+'/'+tasks.length+'</span></div>'+
(adding?'<form class="add-form" data-form="add-goal-task" data-goal="'+e(g.id)+'"><input class="field" name="title" maxlength="150" aria-label="タスク名" placeholder="次のタスクを入力" required autocomplete="off"><button class="btn primary" type="submit">追加</button></form>':'')+
'<div class="goal-actions"><button class="textbtn" data-act="open-goal" data-id="'+e(g.id)+'">すべて見る '+ic('chevron','sm')+'</button><button class="btn secondary" data-act="toggle-add" data-id="'+e(g.id)+'">'+ic(adding?'x':'plus','sm')+(adding?'閉じる':'タスクを追加')+'</button></div></article>'}
function renderHome(){const active=data.goals.filter(g=>g.status!=='done'),completed=data.goals.filter(g=>g.status==='done');const goals=active.concat(completed);const outstanding=data.tasks.filter(t=>!t.done).length;return '<section class="intro"><div><p class="eyebrow">YOUR NEXT STEP</p><h1>今日、何を進める？</h1><p class="muted">ゴールごとに、次の1件だけを表示しています。</p></div><button class="btn primary" data-act="new-goal">'+ic('plus','sm')+' ゴール</button></section>'+(goals.length?'<div class="grid">'+goals.map(goalCard).join('')+'</div>':'<div class="empty"><div class="empty-icon">'+ic('target','lg')+'</div><h2>まずは、やりたいことを1つ。</h2><p>ゴールを決めて、最初のタスクを追加するだけ。複雑な設定は不要です。</p><button class="btn primary" data-act="new-goal">'+ic('plus','sm')+' 最初のゴールをつくる</button><button class="textbtn" data-act="load-demo">サンプルで試す</button></div>')+'<div class="low-links"><span>未完了 '+outstanding+'件</span><span>·</span><button data-act="backup">データをバックアップ</button></div>'}
function queueRow(t,gid,index,total){return '<li class="queue-row">'+checkButton(t)+'<div class="content">'+(index===0?'<p class="priority-flag">次にやること</p>':'')+'<button class="task-name" data-act="edit-task" data-id="'+e(t.id)+'">'+e(t.title)+'</button>'+(taskObj(t).length?'<p class="tiny-objective">目標：'+e(taskObj(t).join('・'))+'</p>':'')+'</div><div class="arrows"><button title="上へ" data-act="move-up" data-goal="'+e(gid)+'" data-id="'+e(t.id)+'" '+(index===0?'disabled':'')+'>'+ic('up','sm')+'</button><button title="下へ" data-act="move-down" data-goal="'+e(gid)+'" data-id="'+e(t.id)+'" '+(index===total-1?'disabled':'')+'>'+ic('down','sm')+'</button></div></li>'}
function renderDetail(){let g=findGoal(ui.goalId);if(!g){ui.goalId=null;return renderHome()}let tasks=queue(g.id),remaining=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);let targets=data.objectives.filter(o=>(o.goalIds||[]).includes(g.id));return '<button class="back" data-act="back-home">'+ic('left','sm')+' ゴールに戻る</button><section class="detail-head"><p class="eyebrow">GOAL</p><h1>'+e(g.title)+'</h1><p>'+(g.description?e(g.description):'ゴールに向けて、一歩ずつ進めよう。')+'</p><div class="detail-controls"><span class="subtle">'+done.length+'/'+tasks.length+'件完了</span><button class="btn ghost" data-act="edit-goal" data-id="'+e(g.id)+'">'+ic('more','sm')+' ゴールの設定</button></div></section><section class="detail-panel"><div class="section-head"><h2>やること</h2><span class="section-note">上下の矢印で順番を変更できます</span></div><form class="detail-add" data-form="add-goal-task" data-goal="'+e(g.id)+'"><input class="field" name="title" maxlength="150" aria-label="タスク名" placeholder="タスクを追加..." autocomplete="off" required><button class="btn primary" type="submit">'+ic('plus','sm')+' 追加</button></form>'+(remaining.length?'<ol class="queue">'+remaining.map((t,i)=>queueRow(t,g.id,i,remaining.length)).join('')+'</ol>':'<p class="quiet-empty">未完了タスクはありません。次の一歩を追加しましょう。</p>')+(done.length?'<details class="details-fold"><summary>完了したタスク '+done.length+'件 '+ic('down','sm')+'</summary><ol class="queue">'+done.map(t=>'<li class="queue-row">'+checkButton(t)+'<div class="content"><button class="task-name done" data-act="edit-task" data-id="'+e(t.id)+'">'+e(t.title)+'</button></div></li>').join('')+'</ol></details>':'')+'</section><section class="detail-panel"><div class="section-head"><h2>目標（任意）</h2><button class="textbtn" data-act="new-target" data-goal="'+e(g.id)+'">'+ic('plus','sm')+' 追加</button></div>'+(targets.length?targets.map(o=>'<div class="objective-row"><button data-act="edit-target" data-id="'+e(o.id)+'">'+ic('flag','sm')+' '+e(o.title)+'</button><span class="subtle">'+data.tasks.filter(t=>(t.objectiveIds||[]).includes(o.id)).length+'件のタスク</span></div>').join(''):'<p class="subtle">細かい目標が必要になったら追加できます。</p>')+'</section><div class="low-links"><button data-act="backup">データをバックアップ</button></div>'}
function allRow(t){const labels=goalIds(t).map(id=>findGoal(id)?.title).filter(Boolean);return '<div class="all-row">'+checkButton(t)+'<div style="min-width:0;flex:1"><button class="task-name '+(t.done?'done':'')+'" data-act="edit-task" data-id="'+e(t.id)+'">'+e(t.title)+'</button><p class="context">'+e(labels.join(' ・ ')||'ゴール未設定')+(taskObj(t).length?' / '+e(taskObj(t).join(' ・ ')):'')+'</p></div></div>'}
function matrixRow(t){return '<div class="matrix-row">'+checkButton(t)+'<div style="min-width:0"><button class="task-name" data-act="edit-task" data-id="'+e(t.id)+'">'+e(t.title)+'</button><p class="tiny">'+e(goalIds(t).map(id=>findGoal(id)?.title).filter(Boolean).join('・')||'ゴール未設定')+'</p></div></div>'}
function matrixView(list){let cells=[['today','must','今日・必須'],['later','must','後日・必須'],['today','optional','今日・任意'],['later','optional','後日・保留']];let unclassified=list.filter(t=>!(t.when==='today'||t.when==='later')||!(t.importance==='must'||t.importance==='optional'));return '<p class="subtle" style="margin:0 0 12px">タスクの詳細で「今日／後日」「必須／任意」を設定すると表示されます。</p><div class="matrix">'+cells.map(z=>'<div class="quad"><h3>'+z[2]+'</h3>'+(list.filter(t=>t.when===z[0]&&t.importance===z[1]).map(matrixRow).join('')||'<p>タスクなし</p>')+'</div>').join('')+'</div>'+(unclassified.length?'<section class="detail-panel" style="margin-top:14px"><div class="section-head"><h2>未分類 '+unclassified.length+'件</h2></div>'+unclassified.map(allRow).join('')+'</section>':'')}
function renderAll(){let relevant=data.tasks.filter(t=>(ui.filter==='all'||goalIds(t).includes(ui.filter))&&(ui.showDone||!t.done));return '<section class="intro"><div><p class="eyebrow">ALL TASKS</p><h1>タスク一覧</h1><p class="muted">思いついたことは、まず名前だけ登録。</p></div></section><form class="global-add" data-form="add-task"><input name="title" maxlength="150" placeholder="やることを追加..." aria-label="新しいタスク名" autocomplete="off" required><button class="btn primary" type="submit">'+ic('plus','sm')+' 追加</button></form><div class="filters"><div class="seg"><button data-act="mode" data-mode="list" class="'+(ui.taskMode==='list'?'active':'')+'">一覧</button><button data-act="mode" data-mode="matrix" class="'+(ui.taskMode==='matrix'?'active':'')+'">マトリクス</button></div><select class="select" data-change="filter" aria-label="ゴールで絞り込む"><option value="all">すべてのゴール</option>'+data.goals.map(g=>'<option value="'+e(g.id)+'" '+(ui.filter===g.id?'selected':'')+'>'+e(g.title)+'</option>').join('')+'</select></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span class="subtle">'+relevant.length+'件のタスク</span><label class="subtle"><input type="checkbox" data-change="show-done" '+(ui.showDone?'checked':'')+'> 完了済みを表示</label></div>'+(ui.taskMode==='matrix'?matrixView(relevant):relevant.length?'<div class="all-list">'+relevant.map(allRow).join('')+'</div>':'<div class="empty"><h2>タスクがありません</h2><p>思いついたことを1件、登録してみよう。</p></div>')+'<div class="low-links"><button data-act="backup">データをバックアップ</button><button data-act="restore">バックアップから復元</button></div>'}
function render(){document.getElementById('app').innerHTML='<div class="app"><header class="topbar"><div class="brand"><span class="brandmark">'+ic('target','sm')+'</span><span>goalpath</span></div><div class="topright"><nav class="topnav" aria-label="画面を切り替える"><button class="'+(ui.page==='home'?'active':'')+'" data-act="page" data-page="home">ゴール</button><button class="'+(ui.page==='all'?'active':'')+'" data-act="page" data-page="all">タスク</button></nav><button class="iconbtn" data-act="backup" title="バックアップ" aria-label="バックアップ">'+ic('download')+'</button></div></header><main class="container">'+(ui.page==='all'?renderAll():ui.goalId?renderDetail():renderHome())+'</main><nav class="bottom-nav" aria-label="画面を切り替える"><button class="'+(ui.page==='home'?'active':'')+'" data-act="page" data-page="home">'+ic('target')+'<span>ゴール</span></button><button class="'+(ui.page==='all'?'active':'')+'" data-act="page" data-page="all">'+ic('list')+'<span>タスク</span></button></nav></div>';}
function textField(name,title,value='',placeholder='',type='text'){return '<div class="formline"><label for="field-'+name+'">'+title+'</label><input class="field" id="field-'+name+'" name="'+name+'" type="'+type+'" value="'+e(value)+'" placeholder="'+e(placeholder)+'" '+(name==='title'?'required maxlength="150"':'')+'></div>'}
function checks(kind,selection){let rows=kind==='goalIds'?data.goals:data.objectives;return rows.length?'<div class="option-list">'+rows.map(x=>'<label><input type="checkbox" name="'+kind+'" value="'+e(x.id)+'" '+(selection.includes(x.id)?'checked':'')+'><span>'+e(x.title)+'</span></label>').join('')+'</div>':'<p class="helper">'+(kind==='goalIds'?'ゴール':'目標')+'はまだありません。</p>'}
function checkrow(i){return '<div class="subcheck"><input type="checkbox" '+(i?.done?'checked':'')+'><input type="text" class="field" name="checkText" maxlength="150" value="'+e(i?.text||'')+'" placeholder="チェック項目"><button data-act="remove-check" type="button" aria-label="削除">×</button></div>'}
function editor(){const root=document.getElementById('sheet-root');if(!ui.sheet){root.innerHTML='';document.body.style.overflow='';return}document.body.style.overflow='hidden';const {type,id,context}=ui.sheet;const existing=type==='goal'?findGoal(id):type==='objective'?findObj(id):findTask(id);const editing=!!existing;const initial=existing||{title:'',goalIds:context?.goalId?[context.goalId]:[],objectiveIds:context?.objId?[context.objId]:[],status:'active',description:'',deadline:'',note:'',when:'',importance:'',plannedDate:'',dueDate:'',done:false,checklist:[]};const name=type==='goal'?'ゴール':type==='objective'?'目標':'タスク';let body=textField('title',name+'名',initial.title,'名前を入力');if(type==='goal')body+='<details class="advanced"><summary>詳細設定 '+ic('down','sm')+'</summary><div class="adv-body"><div class="formline"><label>説明</label><textarea class="field" name="description">'+e(initial.description||'')+'</textarea></div>'+textField('deadline','期限',initial.deadline||'','','date')+'<div class="formline"><label>達成状態</label><select class="field" name="status">'+[['active','進行中'],['done','達成済み'],['paused','一時停止']].map(x=>'<option value="'+x[0]+'" '+(initial.status===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div></div></details>';
if(type==='objective')body+='<details class="advanced" open><summary>関連するゴール '+ic('down','sm')+'</summary><div class="adv-body">'+checks('goalIds',initial.goalIds||[])+'</div></details>';
if(type==='task')body+='<p class="helper">詳細は必要なときだけ設定できます。</p><details class="advanced"><summary>詳細設定・関連付け '+ic('down','sm')+'</summary><div class="adv-body"><div class="formline"><label>メモ</label><textarea class="field" name="note" placeholder="補足など">'+e(initial.note||'')+'</textarea></div><div class="form-grid"><div class="formline"><label>実行区分</label><select class="field" name="when">'+[['','未設定'],['today','今日'],['later','後日']].map(x=>'<option value="'+x[0]+'" '+(initial.when===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div><div class="formline"><label>必要性</label><select class="field" name="importance">'+[['','未設定'],['must','必須'],['optional','任意']].map(x=>'<option value="'+x[0]+'" '+(initial.importance===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>'+textField('plannedDate','実行予定日',initial.plannedDate||'','','date')+textField('dueDate','期限',initial.dueDate||'','','date')+'</div><div class="formline"><label>関連するゴール（複数可）</label>'+checks('goalIds',initial.goalIds||[])+'</div><div class="formline"><label>関連する目標（複数可）</label>'+checks('objectiveIds',initial.objectiveIds||[])+'</div><div class="formline"><label>チェックリスト</label><div id="check-rows">'+(initial.checklist||[]).map(checkrow).join('')+'</div><button type="button" class="btn secondary" data-act="add-check">'+ic('plus','sm')+' 項目を追加</button></div><label class="helper"><input type="checkbox" name="done" '+(initial.done?'checked':'')+'> 完了済みにする</label></div></details>';
root.innerHTML='<div class="sheet-backdrop" id="sheet-backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-header"><h2 id="sheet-title">'+name+(editing?'を編集':'を追加')+'</h2><button class="iconbtn" data-act="close-sheet" aria-label="閉じる">'+ic('x')+'</button></div><form id="editor-form" data-type="'+type+'" data-id="'+e(id||'')+'" style="display:flex;flex-direction:column;min-height:0;flex:1"><div class="sheet-body">'+body+'</div><div class="sheet-footer">'+(editing?'<button class="btn danger" type="button" data-act="delete" data-type="'+type+'" data-id="'+e(id)+'">削除</button>':'<button class="btn ghost" type="button" data-act="close-sheet">キャンセル</button>')+'<button class="btn primary" type="submit">'+(editing?'保存する':'追加する')+'</button></div></form></div></div>';root.querySelector('input[name=title]')?.focus({preventScroll:true});}
function openSheet(type,id=null,context={}){ui.sheet={type,id,context};editor()};function closeSheet(){ui.sheet=null;editor()}
function saveEditor(form){const fd=new FormData(form),type=form.dataset.type,id=form.dataset.id||null,title=String(fd.get('title')||'').trim();if(!title){toast('名前を入力してください');return}const pick=n=>fd.getAll(n).map(String);const previous=type==='goal'?findGoal(id):type==='objective'?findObj(id):findTask(id);const editing=!!previous;let obj;if(type==='goal'){obj={...(previous||{}),id:id||uid('g'),title,description:String(fd.get('description')||''),deadline:String(fd.get('deadline')||''),status:String(fd.get('status')||'active')};if(editing)Object.assign(previous,obj);else data.goals.push(obj)}else if(type==='objective'){obj={...(previous||{}),id:id||uid('o'),title,goalIds:pick('goalIds'),status:previous?.status||'active',description:previous?.description||''};if(editing)Object.assign(previous,obj);else data.objectives.push(obj)}else{const checklist=[...form.querySelectorAll('#check-rows .subcheck')].map(row=>({text:row.querySelector('input[name=checkText]')?.value.trim()||'',done:!!row.querySelector('input[type=checkbox]')?.checked})).filter(x=>x.text);obj={...(previous||{}),id:id||uid('t'),title,note:String(fd.get('note')||''),when:String(fd.get('when')||''),importance:String(fd.get('importance')||''),plannedDate:String(fd.get('plannedDate')||''),dueDate:String(fd.get('dueDate')||''),done:fd.has('done'),goalIds:pick('goalIds'),objectiveIds:pick('objectiveIds'),checklist};if(editing)Object.assign(previous,obj);else data.tasks.push(obj);const gid=ui.sheet?.context?.goalId;if(!editing&&gid){data.goalOrders[gid]||=[];data.goalOrders[gid].push(obj.id)}}persist();closeSheet();render();if(type==='goal'&&!editing){ui.page='home';ui.goalId=null;ui.addingGoal=obj.id;render();document.querySelector('[data-card="'+CSS.escape(obj.id)+'"] input[name=title]')?.focus()}toast(nameFor(type)+(editing?'を保存しました':'を追加しました'))}
const nameFor=type=>type==='goal'?'ゴール':type==='objective'?'目標':'タスク';
function toggle(id){const t=findTask(id);if(!t)return;const before=t.done;t.done=!t.done;persist();undo={type:'task',id,previous:before};render();toast(t.done?'完了！ 次のタスクを表示しました':'未完了に戻しました',true)}
function reorder(gid,tid,dir){let available=queue(gid).filter(t=>!t.done).map(t=>t.id);const at=available.indexOf(tid),next=at+dir;if(at<0||next<0||next>=available.length)return;[available[at],available[next]]=[available[next],available[at]];const finished=queue(gid).filter(t=>t.done).map(t=>t.id);data.goalOrders[gid]=[...available,...finished];persist();render();toast('順番を変更しました')}
function deleteItem(type,id){if(!confirm(nameFor(type)+'を削除しますか？ 関連するほかの項目は削除されません。'))return;if(type==='goal'){data.goals=data.goals.filter(g=>g.id!==id);data.objectives.forEach(o=>o.goalIds=(o.goalIds||[]).filter(k=>k!==id));data.tasks.forEach(t=>t.goalIds=(t.goalIds||[]).filter(k=>k!==id));delete data.goalOrders[id];if(ui.goalId===id)ui.goalId=null;if(ui.filter===id)ui.filter='all'}else if(type==='objective'){data.objectives=data.objectives.filter(o=>o.id!==id);data.tasks.forEach(t=>t.objectiveIds=(t.objectiveIds||[]).filter(k=>k!==id))}else{data.tasks=data.tasks.filter(t=>t.id!==id);Object.keys(data.goalOrders).forEach(g=>data.goalOrders[g]=data.goalOrders[g].filter(k=>k!==id))}persist();closeSheet();render();toast(nameFor(type)+'を削除しました')}
function backup(){const blob=new Blob([JSON.stringify({format:'goalpath-backup-v1',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='goalpath-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('バックアップを保存しました')}
function actions(target){const btn=target.closest('[data-act]');if(!btn)return;const a=btn.dataset.act,id=btn.dataset.id;switch(a){case'page':ui.page=btn.dataset.page;ui.goalId=null;ui.addingGoal=null;render();window.scrollTo(0,0);break;case'new-goal':openSheet('goal');break;case'open-goal':ui.page='home';ui.goalId=id;ui.addingGoal=null;render();window.scrollTo(0,0);break;case'back-home':ui.goalId=null;render();window.scrollTo(0,0);break;case'toggle-add':ui.addingGoal=ui.addingGoal===id?null:id;render();if(ui.addingGoal)document.querySelector('[data-card="'+CSS.escape(id)+'"] input[name=title]')?.focus();break;case'toggle-task':toggle(id);break;case'edit-task':openSheet('task',id);break;case'edit-goal':openSheet('goal',id);break;case'edit-target':openSheet('objective',id);break;case'new-target':openSheet('objective',null,{goalId:btn.dataset.goal});break;case'move-up':reorder(btn.dataset.goal,id,-1);break;case'move-down':reorder(btn.dataset.goal,id,1);break;case'mode':ui.taskMode=btn.dataset.mode;render();break;case'close-sheet':closeSheet();break;case'add-check':document.getElementById('check-rows')?.insertAdjacentHTML('beforeend',checkrow());break;case'remove-check':btn.closest('.subcheck')?.remove();break;case'delete':deleteItem(btn.dataset.type,id);break;case'backup':backup();break;case'restore':document.getElementById('restore-input')?.click();break;case'undo':if(undo?.type==='task'){const t=findTask(undo.id);if(t){t.done=undo.previous;persist();render();}undo=null;document.getElementById('toast').classList.remove('show')}break;case'load-demo':if(!data.goals.length&&!data.tasks.length){data=demo();persist();render();toast('サンプルを表示しました')}break;}}
document.addEventListener('click',evt=>{if(evt.target.id==='sheet-backdrop'){closeSheet();return}actions(evt.target)});
document.addEventListener('submit',evt=>{const f=evt.target;if(f.id==='editor-form'){evt.preventDefault();saveEditor(f);return}if(!f.dataset.form)return;evt.preventDefault();const title=(f.querySelector('input[name=title]')?.value||'').trim();if(!title)return;if(f.dataset.form==='add-goal-task'){addTask(title,{goalId:f.dataset.goal});render();const input=document.querySelector('[data-form="add-goal-task"][data-goal="'+CSS.escape(f.dataset.goal)+'"] input[name=title]');if(input)input.focus();toast('タスクを追加しました')}else if(f.dataset.form==='add-task'){addTask(title);render();document.querySelector('[data-form="add-task"] input[name=title]')?.focus();toast('タスクを追加しました')}});
document.addEventListener('change',evt=>{if(evt.target.dataset.change==='filter'){ui.filter=evt.target.value;render()}else if(evt.target.dataset.change==='show-done'){ui.showDone=evt.target.checked;render()}});
document.addEventListener('keydown',evt=>{if(evt.key==='Escape'&&ui.sheet)closeSheet()});
document.getElementById('restore-input').addEventListener('change',async function(){const file=this.files?.[0];this.value='';if(!file)return;try{const raw=JSON.parse(await file.text());const incoming=normalize(raw?.format==='goalpath-backup-v1'?raw.data:raw);if(!incoming)throw new Error('形式が違います');if(!confirm('今のデータをバックアップの内容で置き換えますか？'))return;data=incoming;persist();ui.page='home';ui.goalId=null;render();toast('バックアップを復元しました')}catch(ex){toast('ファイルを読み込めませんでした')}});
render();
})();
</script>
</body>
</html>
