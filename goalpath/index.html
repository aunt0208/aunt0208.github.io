function read(){try{const obj=JSON.parse(localStorage.getItem(KEY));if(obj&&Array.isArray(obj.goals)&&Array.isArray(obj.objectives)&&Array.isArray(obj.tasks))return obj}catch(e){}return demo()}
let data=read(),ui={tab:'goals',goalDetail:null,objectiveDetail:null,goalFilter:'all',taskStatus:'open',search:'',showDoneMatrix:false,drawer:null,kindChooser:false};
let toastTimer;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notice('この環境では保存できないため、更新内容は画面内のみ保持されます')}};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const newId=prefix=>prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const statusLabel=s=>s==='done'?'達成済み':s==='paused'?'一時停止':'進行中';
const statusClass=s=>s==='done'?'done':s==='paused'?'todo':'';
const goalById=id=>data.goals.find(g=>g.id===id);
const objectiveById=id=>data.objectives.find(o=>o.id===id);
const taskGoals=t=>[...new Set([...(t.goalIds||[]),...(t.objectiveIds||[]).flatMap(id=>objectiveById(id)?.goalIds||[])])].filter(id=>!!goalById(id));
const goalsTasks=id=>data.tasks.filter(t=>taskGoals(t).includes(id));
const objectiveTasks=id=>data.tasks.filter(t=>(t.objectiveIds||[]).includes(id));
const short=(text,n=22)=>String(text).length>n?String(text).slice(0,n)+'…':String(text);
const smallList=(task,limit=2)=>{const gids=taskGoals(task),oids=(task.objectiveIds||[]).filter(id=>objectiveById(id));const chips=[...gids.map(id=>`<span class="chip goal" title="${esc(goalById(id).title)}">${esc(short(goalById(id).title,25))}</span>`),...oids.map(id=>`<span class="chip objective" title="${esc(objectiveById(id).title)}">${esc(short(objectiveById(id).title,25))}</span>`)];return chips.length?chips.slice(0,limit).join('')+(chips.length>limit?`<span class="chip blank">ほか${chips.length-limit}</span>`:''):`<span class="chip blank">ゴール未設定</span>`};
const completed=t=>!!t.done;
function notice(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2400)}
function pageHeading(title,subtitle,tag){return `<div class="page-top"><div><p class="eyebrow">${esc(tag||'YOUR WORKSPACE')}</p><h1 class="page-title">${esc(title)}</h1><p class="page-sub">${esc(subtitle)}</p></div></div>`}
function cardGoal(g){const objs=data.objectives.filter(o=>(o.goalIds||[]).includes(g.id));const ts=goalsTasks(g.id);const complete=ts.filter(completed).length;return `<article class="goal-card"><div class="goal-top"><div class="goal-symbol">${icon('target')}</div><div style="flex:1;min-width:0"><h3 class="goal-title">${esc(g.title)}</h3><p class="goal-desc">${esc(g.description||'説明は未設定')}</p></div><span class="status ${statusClass(g.status)}">${statusLabel(g.status)}</span></div><div class="goal-goals">${objs.length?objs.slice(0,3).map(o=>`<div class="objective-mini">${icon(o.status==='done'?'check':'flag','xs')}<span>${esc(o.title)}</span>${o.goalIds.length>1?'<span class="overlap">共通</span>':''}</div>`).join('')+(objs.length>3?`<span class="hint">ほか${objs.length-3}件</span>`:''):`<span class="hint">まだ目標がありません</span>`}</div><div><div class="card-bottom" style="margin-bottom:9px"><span>関連タスクの完了 <strong>${complete}/${ts.length}</strong></span><span>${ts.length?Math.round(complete/ts.length*100):0}%（タスク基準）</span></div><div class="progressline"><div style="width:${ts.length?complete/ts.length*100:0}%"></div></div></div><div class="card-bottom"><span>${objs.length}件の目標</span><button class="link-button" data-act="goal-open" data-id="${esc(g.id)}">ゴールを開く ${icon('arrow','sm')}</button></div></article>`}
function renderGoals(){const count=data.tasks.filter(t=>!t.done).length;return pageHeading('ゴール','やることだけでなく、「何のために」を見失わない。','YOUR DESTINATION')+`<div class="grid2"><div class="kpi"><div class="kpi-label">進行中のゴール</div><div class="kpi-big">${data.goals.filter(g=>g.status==='active').length}</div><div class="kpi-foot">達成状況は自分で判断する</div></div><div class="kpi"><div class="kpi-label">未完了のタスク</div><div class="kpi-big">${count}</div><div class="kpi-foot">関連づけが複数でも1件と数える</div></div></div><div class="sectionbar"><h2>すべてのゴール</h2><button class="link-button" data-act="new-goal">${icon('plus','sm')} ゴールを追加</button></div><div class="grid2 goal-grid">${data.goals.length?data.goals.map(cardGoal).join(''):`<div class="empty">まだゴールがありません。<br><strong>最初のゴールを追加しましょう。</strong></div>`}</div><p class="footnote">表示されている割合は「関連タスクの完了率」であり、ゴールの達成率ではありません。ゴールや目標の達成状態は個別に設定できます。</p>`}
function taskRow(t){return `<article class="task-card"><button class="check-btn ${t.done?'done':''}" data-act="task-toggle" data-id="${esc(t.id)}" aria-label="${t.done?'未完了に戻す':'完了する'}：${esc(t.title)}">${icon('check','sm')}</button><div class="task-main"><div class="task-title ${t.done?'done':''}" role="button" tabindex="0" data-act="task-edit" data-id="${esc(t.id)}">${esc(t.title)}</div><div class="chips">${smallList(t,4)}${t.dueDate?`<span class="chip due">期限 ${esc(t.dueDate.slice(5).replace('-','/'))}</span>`:''}</div></div><button class="task-more" data-act="task-edit" data-id="${esc(t.id)}" aria-label="タスクの詳細を開く">${icon('chevron')}</button></article>`}
function renderTasks(){const filtered=data.tasks.filter(t=>(ui.goalFilter==='all'||taskGoals(t).includes(ui.goalFilter))&&(ui.taskStatus!=='open'||!t.done)&&(!ui.search||[t.title,t.note||'',...taskGoals(t).map(id=>goalById(id)?.title),...(t.objectiveIds||[]).map(id=>objectiveById(id)?.title)].join(' ').toLowerCase().includes(ui.search.toLowerCase())));return pageHeading('タスク','まず名前だけ追加。目的とのつながりは、あとから自由に設定できます。','YOUR ACTIONS')+`<form class="quick" id="quick-add"><span style="color:var(--accent);padding-left:6px">${icon('plus')}</span><input name="title" aria-label="新しいタスク" autocomplete="off" placeholder="新しいタスクをすばやく追加…" maxlength="150" required><button class="primary" type="submit">追加</button></form><div class="toolbar"><div class="search">${icon('search')}<input data-input="search" value="${esc(ui.search)}" placeholder="タスクを検索" aria-label="タスクを検索"></div><select data-change="goal-filter" aria-label="ゴールで絞り込む"><option value="all">すべてのゴール</option>${data.goals.map(g=>`<option value="${esc(g.id)}" ${ui.goalFilter===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}</select><select data-change="task-status" aria-label="タスクの状態"><option value="open" ${ui.taskStatus==='open'?'selected':''}>未完了のみ</option><option value="all" ${ui.taskStatus==='all'?'selected':''}>すべて表示</option></select></div><div class="sectionbar" style="margin-top:10px"><h2>${ui.taskStatus==='open'?'取り組むタスク':'すべてのタスク'}</h2><span class="text">${filtered.length}件</span></div><div class="task-list">${filtered.length?filtered.map(taskRow).join(''):`<div class="empty">表示するタスクがありません。<br>検索やフィルターを変更してみてください。</div>`}</div>`}
function matrixTask(t){let derived=taskGoals(t).map(id=>goalById(id)?.title).filter(Boolean);return `<div class="matrix-task"><button class="check-btn ${t.done?'done':''}" data-act="task-toggle" data-id="${esc(t.id)}" aria-label="${t.done?'未完了に戻す':'完了'}">${icon('check','sm')}</button><div class="matrix-task-body"><div class="matrix-task-name ${t.done?'done':''}" role="button" tabindex="0" data-act="task-edit" data-id="${esc(t.id)}">${esc(t.title)}</div><div class="matrix-task-desc">${esc(short(derived.join('・')||'ゴール未設定',29))}</div></div></div>`}
function renderMatrix(){const zones=[{id:'tm',title:'今日・必須',sub:'優先して取り組む',w:'today',i:'must'},{id:'lm',title:'後日・必須',sub:'予定を決めて進める',w:'later',i:'must'},{id:'to',title:'今日・任意',sub:'余裕があれば',w:'today',i:'optional'},{id:'lo',title:'後日・保留',sub:'必要に応じて',w:'later',i:'optional'}];const relevant=data.tasks.filter(t=>(ui.goalFilter==='all'||taskGoals(t).includes(ui.goalFilter))&&(ui.showDoneMatrix||!t.done));const unclassified=relevant.filter(t=>!t.when||!t.importance);return pageHeading('マトリクス','Linky型の4象限で、行動の優先順位とゴールを一緒に確認。','YOUR PRIORITIES')+`<div class="toolbar" style="margin-bottom:18px"><select data-change="goal-filter" aria-label="ゴールで絞り込む"><option value="all">すべてのゴール</option>${data.goals.map(g=>`<option value="${esc(g.id)}" ${ui.goalFilter===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}</select><label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);cursor:pointer"><input type="checkbox" data-change="matrix-done" ${ui.showDoneMatrix?'checked':''} style="accent-color:var(--accent)">完了済みも表示</label></div><div class="matrix">${zones.map(z=>{const found=relevant.filter(t=>t.when===z.w&&t.importance===z.i);return `<section class="matrix-zone zone-${z.id}"><div class="matrix-head"><span class="matrix-dot"></span><h3>${z.title}</h3><span class="matrix-count">${found.length}</span></div><p class="matrix-caption">${z.sub}</p><div class="matrix-tasks">${found.length?found.map(matrixTask).join(''):`<div class="matrix-none">タスクなし</div>`}</div></section>`}).join('')}</div>${unclassified.length?`<section class="matrix-unclassified"><h3>未分類のタスク（${unclassified.length}）</h3><p>「今日／後日」「必須／任意」のどちらかが未設定です。勝手に4象限には配置しません。</p>${unclassified.map(t=>`<button data-act="task-edit" data-id="${esc(t.id)}">${icon('chevron','sm')} ${esc(t.title)}</button>`).join('')}</section>`:''}<p class="footnote">象限は手動設定です。日付が変わっても自動移動しません。実行予定日と締切日は別に管理できます。</p>`}
function renderGoalDetail(){const g=goalById(ui.goalDetail);if(!g){ui.goalDetail=null;return renderGoals()}const objs=data.objectives.filter(o=>(o.goalIds||[]).includes(g.id));const ts=goalsTasks(g.id);return `<nav class="breadcrumb"><button data-act="back-goals">ゴール一覧</button>${icon('chevron','xs')}<span>${esc(short(g.title,25))}</span></nav><div class="detail-head"><div class="big-icon">${icon('target','lg')}</div><div style="flex:1"><p class="eyebrow">GOAL</p><h1>${esc(g.title)}</h1><p>${esc(g.description||'説明はまだありません')}</p></div><button class="ghost" data-act="goal-edit" data-id="${esc(g.id)}">${icon('edit','sm')} 編集</button></div><div class="detail-summary"><span class="stat-pill">状態：<strong>${statusLabel(g.status)}</strong></span><span class="stat-pill">目標：<strong>${objs.length}件</strong></span><span class="stat-pill">関連タスク完了：<strong>${ts.filter(completed).length}/${ts.length}件</strong></span></div><div class="sectionbar"><h2>つながる目標</h2><button class="link-button" data-act="new-objective" data-goal="${esc(g.id)}">${icon('plus','sm')} 目標を追加</button></div><div class="stack">${objs.length?objs.map(o=>objectiveCard(o)).join(''):'<div class="empty">目標はまだありません。タスクを直接このゴールにつなぐこともできます。</div>'}</div><div class="sectionbar"><h2>関連するタスク</h2><button class="link-button" data-act="new-task" data-goal="${esc(g.id)}">${icon('plus','sm')} タスクを追加</button></div><div class="task-list">${ts.length?ts.map(taskRow).join(''):'<div class="empty">タスクはまだありません。</div>'}</div><p class="footnote">他のゴールから参照しても、目標やタスクの実体は1つです。この画面では共通の対象も表示されます。</p>`}
function objectiveCard(o){const ts=objectiveTasks(o.id);return `<article class="obj-card"><div class="obj-row"><div class="obj-icon">${icon('flag','sm')}</div><div class="obj-body"><div class="obj-title">${esc(o.title)} ${o.goalIds.length>1?'<span class="overlap">複数ゴール</span>':''}</div><div class="obj-sub">${statusLabel(o.status)} ・ 関連タスク ${ts.filter(completed).length}/${ts.length}件完了</div></div><button class="obj-arrow" data-act="objective-open" data-id="${esc(o.id)}" aria-label="目標を開く">${icon('chevron')}</button></div></article>`}
function renderObjectiveDetail(){const o=objectiveById(ui.objectiveDetail);if(!o){ui.objectiveDetail=null;return renderGoals()}const ts=objectiveTasks(o.id);const first=o.goalIds.find(id=>goalById(id));return `<nav class="breadcrumb"><button data-act="back-goals">ゴール一覧</button>${icon('chevron','xs')}<button ${first?`data-act="goal-open" data-id="${esc(first)}"`:'data-act="back-goals"'}>${first?esc(short(goalById(first).title,18)):'未設定'}</button>${icon('chevron','xs')}<span>${esc(short(o.title,18))}</span></nav><div class="detail-head"><div class="big-icon" style="background:var(--blueTint);color:var(--blue)">${icon('flag','lg')}</div><div style="flex:1"><p class="eyebrow">TARGET</p><h1>${esc(o.title)}</h1><p>${esc(o.description||'説明はまだありません')}</p></div><button class="ghost" data-act="objective-edit" data-id="${esc(o.id)}">${icon('edit','sm')} 編集</button></div><div class="detail-summary"><span class="stat-pill">状態：<strong>${statusLabel(o.status)}</strong></span><span class="stat-pill">関連ゴール：<strong>${o.goalIds.length}件</strong></span><span class="stat-pill">関連タスク完了：<strong>${ts.filter(completed).length}/${ts.length}件</strong></span></div><div class="sectionbar"><h2>関連するゴール</h2><button class="link-button" data-act="objective-edit" data-id="${esc(o.id)}">${icon('link','sm')} 関連付けを変更</button></div><div class="chips" style="margin-bottom:19px">${o.goalIds.length?o.goalIds.map(id=>goalById(id)?`<span class="chip goal">${esc(goalById(id).title)}</span>`:'').join(''):'<span class="chip blank">ゴール未設定</span>'}</div><div class="sectionbar"><h2>目標につながるタスク</h2><button class="link-button" data-act="new-task" data-objective="${esc(o.id)}">${icon('plus','sm')} タスクを追加</button></div><div class="task-list">${ts.length?ts.map(taskRow).join(''):'<div class="empty">タスクはまだありません。</div>'}</div>`}
const navItems=[{id:'goals',icon:'target',label:'ゴール'},{id:'tasks',icon:'list',label:'タスク'},{id:'matrix',icon:'grid',label:'マトリクス'}];
function render(){if(ui.tab==='matrix' || ui.tab==='tasks')ui.goalDetail=null,ui.objectiveDetail=null;const active=ui.tab;let content=ui.objectiveDetail?renderObjectiveDetail():ui.goalDetail?renderGoalDetail():active==='goals'?renderGoals():active==='tasks'?renderTasks():renderMatrix();document.getElementById('app').innerHTML=`<div class="app"><header class="topbar"><div class="brand"><span class="brandmark">${icon('layer','lg')}</span><span>Goalpath<small>GOALS • TARGETS • TASKS</small></span></div><div class="header-right"><button class="small-link" data-act="reset">サンプルに戻す</button><button class="primary" data-act="new-task">${icon('plus','sm')} タスク追加</button></div></header><div class="layout"><aside class="side"><div class="side-label">WORKSPACE</div>${navItems.map(n=>`<button class="nav-button ${active===n.id?'active':''}" data-act="nav" data-tab="${n.id}">${icon(n.icon)}${n.label}<span class="count">${n.id==='goals'?data.goals.length:n.id==='tasks'?data.tasks.length:''}</span></button>`).join('')}<div class="side-bottom">ゴールを中心に、目標とタスクをつなげる。<br>AIなし・手動登録のUI試作版です。</div></aside><main class="main">${content}</main></div><nav class="bottom-nav" aria-label="メインナビゲーション">${navItems.map(n=>`<button class="${active===n.id?'active':''}" data-act="nav" data-tab="${n.id}">${icon(n.icon)}<span>${n.label}</span></button>`).join('')}</nav></div>`}
function openEditor(type,id=null,context={}){ui.drawer={type,id,context};renderDrawer()}
function closeEditor(){ui.drawer=null;document.getElementById('drawer-root').innerHTML=''}
function baseInput(id,label,value='',type='text',extra=''){return `<div class="form-group"><label class="label" for="${id}">${label}</label><input class="text-input" name="${id}" id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function statusOptions(value){return `<select class="select" name="status"><option value="active" ${value==='active'?'selected':''}>進行中</option><option value="done" ${value==='done'?'selected':''}>達成済み</option><option value="paused" ${value==='paused'?'selected':''}>一時停止</option></select>`}
function relationRows(kind,selected){let entries=kind==='goals'?data.goals:data.objectives;return entries.length?entries.map(x=>`<label class="relation-row"><input type="checkbox" name="${kind==='goals'?'goalIds':'objectiveIds'}" value="${esc(x.id)}" ${selected.includes(x.id)?'checked':''}><span class="rtext">${esc(x.title)}</span>${kind==='objectives'&&x.goalIds.length>1?'<span class="overlap">共通</span>':''}</label>`).join(''):`<div class="hint">${kind==='goals'?'ゴール':'目標'}がまだありません。</div>`}
function checklistRows(items){return items.map(item=>`<div class="checklist-item"><input type="checkbox" aria-label="チェックリストの完了" ${item.done?'checked':''}><input type="text" class="text-input" value="${esc(item.text)}" aria-label="チェックリストの項目" maxlength="150"><button class="remove-small" type="button" data-act="remove-check" aria-label="項目を削除">×</button></div>`).join('')}
function renderDrawer(){const e=document.getElementById('drawer-root');if(!ui.drawer){e.innerHTML='';return}const {type,id,context}=ui.drawer;let obj=type==='goal'?goalById(id):type==='objective'?objectiveById(id):data.tasks.find(t=>t.id===id);let editing=!!obj;const draft=obj||({title:'',description:'',status:'active',goalIds:context.goal?[context.goal]:[],objectiveIds:context.objective?[context.objective]:[],note:'',when:'',importance:'',plannedDate:'',dueDate:'',done:false,checklist:[]});const typeName=type==='goal'?'ゴール':type==='objective'?'目標':'タスク';let body='';if(type==='goal')body=`${baseInput('title','ゴール名',draft.title,'text','required maxlength="150" placeholder="達成したいこと"')}<div class="form-group"><label class="label">説明（任意）</label><textarea class="textarea" name="description" placeholder="ゴールの達成条件や補足">${esc(draft.description||'')}</textarea></div><div class="form-grid"><div class="form-group"><label class="label">達成状態</label>${statusOptions(draft.status)}</div>${baseInput('deadline','目標期限（任意）',draft.deadline||'','date')}</div><div class="banner">ゴールの達成は自分で設定します。タスク完了数だけで自動的に達成済みにはしません。</div>`;
else if(type==='objective')body=`${baseInput('title','目標名',draft.title,'text','required maxlength="150" placeholder="ゴールに向かう中間地点"')}<div class="form-group"><label class="label">説明（任意）</label><textarea class="textarea" name="description" placeholder="具体的な達成条件など">${esc(draft.description||'')}</textarea></div><div class="form-group"><label class="label">達成状態</label>${statusOptions(draft.status)}</div><div class="form-group"><div class="label">関連するゴール（複数選択可）</div><div class="relation-group">${relationRows('goals',draft.goalIds||[])}</div><p class="hint">同じ目標を複数のゴールから表示できます。</p></div>`;
else body=`${baseInput('title','タスク名',draft.title,'text','required maxlength="150" placeholder="やることを入力"')}<div class="form-group"><label class="label">メモ（任意）</label><textarea class="textarea" name="note" placeholder="補足やリンクなど">${esc(draft.note||'')}</textarea></div><div class="form-group"><label class="label">完了状態</label><label class="relation-row"><input type="checkbox" name="done" ${draft.done?'checked':''}><span>このタスクは完了済み</span></label></div><hr class="divider"><div class="form-grid"><div class="form-group"><label class="label">実行区分</label><select class="select" name="when"><option value="" ${!draft.when?'selected':''}>未設定</option><option value="today" ${draft.when==='today'?'selected':''}>今日</option><option value="later" ${draft.when==='later'?'selected':''}>後日</option></select></div><div class="form-group"><label class="label">必要性</label><select class="select" name="importance"><option value="" ${!draft.importance?'selected':''}>未設定</option><option value="must" ${draft.importance==='must'?'selected':''}>必須</option><option value="optional" ${draft.importance==='optional'?'selected':''}>任意</option></select></div>${baseInput('plannedDate','実行予定日（任意）',draft.plannedDate||'','date')}${baseInput('dueDate','締切日（任意）',draft.dueDate||'','date')}</div><p class="hint" style="margin:-8px 0 17px">マトリクスの配置は「実行区分×必要性」で決まります。日付だけでは自動移動しません。</p><hr class="divider"><div class="form-group"><label class="label">関連する目標（複数選択可）</label><div class="relation-group">${relationRows('objectives',draft.objectiveIds||[])}</div><p class="hint">目標に紐づけると、その目標に関連するゴールにも表示されます。</p></div><div class="form-group"><label class="label">直接関連づけるゴール（任意）</label><div class="relation-group">${relationRows('goals',draft.goalIds||[])}</div><p class="hint">目標を経由せず、ゴールに直接タスクを紐づけたいときに設定します。</p></div><hr class="divider"><div class="form-group"><label class="label">チェックリスト（任意）</label><div id="checklist-items">${checklistRows(draft.checklist||[])}</div><div class="check-add"><input class="text-input" id="checklist-new" type="text" placeholder="小さな作業を追加" maxlength="150"><button type="button" class="soft" data-act="add-check">${icon('plus','sm')} 追加</button></div></div>`;
e.innerHTML=`<div class="screen-overlay" id="overlay"><div class="drawer" role="dialog" aria-modal="true" aria-label="${editing?'編集':'追加'}：${typeName}"><div class="drawer-head"><h2>${editing?'編集':'追加'}：${typeName}</h2><button class="close" data-act="close" aria-label="閉じる">${icon('x')}</button></div><form id="entity-form" data-type="${type}" data-id="${esc(id||'')}"><div class="drawer-body">${!editing&&type==='task'?'<div class="banner">タスク名だけで保存できます。分類や関連付けは後から編集できます。</div>':''}${body}</div><div class="drawer-foot">${editing?`<button class="danger delete" type="button" data-act="delete" data-type="${type}" data-id="${esc(id)}">削除</button>`:''}<button class="ghost" type="button" data-act="close">キャンセル</button><button class="primary" type="submit">${icon('check','sm')} 保存</button></div></form></div></div>`;
const form=e.querySelector('#entity-form');form.style.display='flex';form.style.flexDirection='column';form.style.flex='1';form.style.minHeight='0';form.querySelector('.drawer-body').style.flex='1';form.querySelector('.drawer-body').style.overflowY='auto';if(!editing){e.querySelector('input[name=title]')?.focus()}}
function saveForm(f){const form=new FormData(f),type=f.dataset.type,id=f.dataset.id||null,title=String(form.get('title')||'').trim();if(!title){notice('名前を入力してください');return}const arrays=n=>form.getAll(n).map(String);let idx,arr;if(type==='goal'){arr=data.goals;idx=arr.findIndex(x=>x.id===id);const next={id:id||newId('g'),title,description:String(form.get('description')||''),status:String(form.get('status')||'active'),deadline:String(form.get('deadline')||'')};if(idx>=0)arr[idx]=next;else arr.push(next)}else if(type==='objective'){arr=data.objectives;idx=arr.findIndex(x=>x.id===id);const next={id:id||newId('o'),title,description:String(form.get('description')||''),status:String(form.get('status')||'active'),goalIds:arrays('goalIds')};if(idx>=0)arr[idx]=next;else arr.push(next)}else{arr=data.tasks;idx=arr.findIndex(x=>x.id===id);const list=[...f.querySelectorAll('#checklist-items .checklist-item')].map(r=>({text:r.querySelector('input[type=text]').value.trim(),done:r.querySelector('input[type=checkbox]').checked})).filter(x=>x.text);const next={id:id||newId('t'),title,note:String(form.get('note')||''),done:form.has('done'),when:String(form.get('when')||''),importance:String(form.get('importance')||''),plannedDate:String(form.get('plannedDate')||''),dueDate:String(form.get('dueDate')||''),objectiveIds:arrays('objectiveIds'),goalIds:arrays('goalIds'),checklist:list};if(idx>=0)arr[idx]=next;else arr.unshift(next)}save();closeEditor();render();notice(type==='goal'?'ゴールを保存しました':type==='objective'?'目標を保存しました':'タスクを保存しました')}
function toggleTask(id){const t=data.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render();notice(t.done?'タスクを完了しました':'未完了に戻しました')}}
function deleteEntity(type,id){const label=type==='goal'?'ゴール':type==='objective'?'目標':'タスク';if(!confirm(`${label}を削除しますか？\n関連する他の項目は削除せず、紐づけのみ解除します。`))return;if(type==='goal'){data.goals=data.goals.filter(x=>x.id!==id);data.objectives.forEach(x=>x.goalIds=x.goalIds.filter(v=>v!==id));data.tasks.forEach(x=>x.goalIds=x.goalIds.filter(v=>v!==id));if(ui.goalDetail===id)ui.goalDetail=null;if(ui.goalFilter===id)ui.goalFilter='all'}else if(type==='objective'){data.objectives=data.objectives.filter(x=>x.id!==id);data.tasks.forEach(x=>x.objectiveIds=x.objectiveIds.filter(v=>v!==id));if(ui.objectiveDetail===id)ui.objectiveDetail=null}else data.tasks=data.tasks.filter(x=>x.id!==id);save();closeEditor();render();notice(`${label}を削除しました`)}
function act(target){const el=target.closest('[data-act]');if(!el)return;const {act,id,tab,goal,objective,type}=el.dataset;switch(act){case'nav':ui.tab=tab;ui.goalDetail=null;ui.objectiveDetail=null;ui.goalFilter='all';ui.search='';render();window.scrollTo(0,0);break;case'goal-open':ui.tab='goals';ui.goalDetail=id;ui.objectiveDetail=null;render();window.scrollTo(0,0);break;case'objective-open':ui.tab='goals';ui.objectiveDetail=id;ui.goalDetail=null;render();window.scrollTo(0,0);break;case'back-goals':ui.tab='goals';ui.goalDetail=null;ui.objectiveDetail=null;render();break;case'new-goal':openEditor('goal');break;case'new-objective':openEditor('objective',null,{goal});break;case'new-task':openEditor('task',null,{goal,objective});break;case'goal-edit':openEditor('goal',id);break;case'objective-edit':openEditor('objective',id);break;case'task-edit':openEditor('task',id);break;case'task-toggle':toggleTask(id);break;case'close':closeEditor();break;case'delete':deleteEntity(type,id);break;case'add-check':{const field=document.getElementById('checklist-new');if(!field)return;const val=field.value.trim();if(!val)return;document.getElementById('checklist-items').insertAdjacentHTML('beforeend',checklistRows([{text:val,done:false}]));field.value='';field.focus();break}case'remove-check':el.closest('.checklist-item')?.remove();break;case'reset':if(confirm('試作データを初期状態に戻しますか？\n追加・編集した内容は失われます。')){data=demo();save();ui={tab:'goals',goalDetail:null,objectiveDetail:null,goalFilter:'all',taskStatus:'open',search:'',showDoneMatrix:false,drawer:null};closeEditor();render();notice('サンプルデータに戻しました')}break;}}
document.addEventListener('click',e=>{if(e.target.id==='overlay'){closeEditor();return}act(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.drawer){closeEditor();return}if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'){e.preventDefault();act(e.target)}});
document.addEventListener('submit',e=>{if(e.target.id==='quick-add'){e.preventDefault();const input=e.target.querySelector('input[name=title]'),title=input.value.trim();if(!title)return;data.tasks.unshift({id:newId('t'),title,note:'',done:false,when:'',importance:'',plannedDate:'',dueDate:'',objectiveIds:[],goalIds:[],checklist:[]});save();render();document.querySelector('#quick-add input')?.focus();notice('タスクを追加しました。詳細は後から設定できます。')}else if(e.target.id==='entity-form'){e.preventDefault();saveForm(e.target)}});
document.addEventListener('change',e=>{const type=e.target.dataset.change;if(type==='goal-filter'){ui.goalFilter=e.target.value;render()}else if(type==='task-status'){ui.taskStatus=e.target.value;render()}else if(type==='matrix-done'){ui.showDoneMatrix=e.target.checked;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.input==='search'){const start=e.target.selectionStart;ui.search=e.target.value;render();const x=document.querySelector('[data-input=search]');if(x){x.focus();x.setSelectionRange(start,start)}}});
render();
})();
</script>
</body>
</html>
