<html lang="ja">
<head>
<meta charset="utf-8">

<title>Goalpath｜ゴールから始めるタスク管理</title>
<style>
:root{--paper:#f8faf8;--surface:#fff;--ink:#202e2a;--muted:#78877f;--line:#e8eee9;--green:#28765d;--green-deep:#195a46;--green-soft:#eaf4ef;--soft:#f3f6f3;--shadow:0 6px 24px rgba(19,45,34,.035)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #9cc9b4;outline-offset:3px}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{min-width:0}
svg{flex-shrink:0}
button,summary{-webkit-tap-highlight-color:transparent}
.app{min-height:100vh;padding-bottom:40px}
.topbar{height:70px;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:0 max(24px,calc((100vw - 880px)/2));border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);position:sticky;top:0;z-index:12;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.7px}
.brandmark{height:29px;width:29px;border-radius:9px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.desktop-nav{display:flex;gap:8px}.desktop-nav button{padding:10px 16px;border-radius:11px;color:#62746a;font-size:14px;font-weight:750}.desktop-nav button.active{background:var(--green-soft);color:var(--green-deep)}
.shell{max-width:880px;margin:auto;padding:34px 24px 50px}
.intro{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.intro h1{font-size:29px;letter-spacing:-1.3px;margin:0;font-weight:820}.intro p{font-size:13px;color:var(--muted);margin:7px 0 0;line-height:1.6}
.primary{background:var(--green);color:#fff;font-size:13px;font-weight:750;padding:11px 16px;border-radius:11px;display:inline-flex;gap:5px;align-items:center;justify-content:center;white-space:nowrap;transition:background .15s}.primary:hover{background:var(--green-deep)}
.ghost{padding:9px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-size:13px;font-weight:650}.ghost:hover{background:var(--soft)}
.plain-action{display:inline-flex;align-items:center;gap:4px;color:var(--green);font-weight:740;font-size:13px;padding:7px 0}.plain-action:hover{text-decoration:underline}
.link-muted{color:var(--muted);font-size:12px;text-decoration:none;padding:5px}.link-muted:hover{color:var(--ink)}
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.icon.sm{width:15px;height:15px}.icon.lg{width:22px;height:22px}
.goal-list{display:grid;gap:14px}.goal-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:22px 23px;box-shadow:var(--shadow)}.goal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:13px}.goal-open{padding:0;text-align:left;min-width:0;display:block;flex:1}.goal-open strong{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.45;display:block}.goal-open:hover strong{color:var(--green)}
.goal-meta{margin:7px 0 0;color:var(--muted);font-size:12px}.status-mini{font-size:11px;color:#a26a2e;background:#fff6e8;border-radius:7px;padding:3px 6px;margin-left:8px;white-space:nowrap}.status-mini.done{color:var(--green);background:var(--green-soft)}
.add-sm{display:inline-flex;gap:4px;align-items:center;justify-content:center;font-size:13px;font-weight:750;color:var(--green);background:var(--green-soft);padding:9px 12px;border-radius:10px;white-space:nowrap}.add-sm:hover{background:#dcefe3}
.goal-preview{margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}.taskline{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}.taskline:last-child{border-bottom:0}.taskline-body{flex:1;min-width:0}.taskline-name{font-size:14px;line-height:1.5;text-align:left;padding:1px 0;font-weight:620;max-width:100%;overflow-wrap:anywhere}.taskline-name:hover{color:var(--green)}.taskline-name.done{text-decoration:line-through;color:#94a29a}.taskline-sub{display:block;font-size:11px;margin-top:3px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}.check-circle{flex:0 0 21px;width:21px;height:21px;border:1.7px solid #b9c9bd;border-radius:50%;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#fff;padding:0}.check-circle:hover{border-color:var(--green)}.check-circle.done{background:var(--green);border-color:var(--green)}.check-circle .icon{width:13px;height:13px;stroke-width:2.6}.peek-more{margin-top:8px}.empty-note{padding:9px 0 5px;color:var(--muted);font-size:13px;line-height:1.6}
.inline-add{display:flex;gap:8px;align-items:center;margin-top:13px;flex-wrap:wrap}.inline-add .field{flex:1;min-width:140px;min-height:42px;font-size:14px;background:var(--surface);padding:10px 13px;border:1px solid #cddfd3;border-radius:10px}.inline-add .primary{min-height:42px}.inline-add:not(.permanent){padding-top:14px;border-top:1px solid var(--line)}
.detail-back{display:inline-flex;align-items:center;gap:4px;margin:-7px 0 24px;color:var(--muted);font-size:13px;font-weight:650;padding:4px 0}.detail-back:hover{color:var(--green)}.detail-title-row{display:flex;align-items:flex-start;gap:14px;justify-content:space-between;margin-bottom:19px}.detail-title{font-size:29px;font-weight:850;line-height:1.4;letter-spacing:-.8px;margin:0}.detail-description{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.7}.detail-meta{font-size:12px;color:var(--muted);margin:8px 0 0}.detail-edit{flex:0 0 auto}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 23px;margin-bottom:15px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.section-head h2{margin:0;font-size:16px;letter-spacing:-.3px}.section-head p{margin:0;color:var(--muted);font-size:12px}.simple-list{display:grid;gap:0}.section-hint{font-size:11px;color:var(--muted);margin:9px 0 0}.section-detail{margin:0}.section-detail summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:9px;cursor:pointer;font-size:15px;font-weight:750;padding:1px 0}.section-detail summary::-webkit-details-marker{display:none}.section-detail summary .summary-side{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:500}.section-detail[open] summary .chev{transform:rotate(90deg)}.objective-row{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 0;border-bottom:1px solid var(--line)}.objective-row:last-of-type{border-bottom:0}.objective-row button:first-child{min-width:0;text-align:left;flex:1}.objective-row strong{font-size:14px;line-height:1.5;display:block}.objective-row span{font-size:11px;color:var(--muted)}.objective-add{font-size:12px;color:var(--green);font-weight:650;padding:8px}
.quick{display:flex;gap:8px;align-items:center;background:var(--surface);padding:7px 7px 7px 14px;border:1px solid var(--line);border-radius:13px;margin-bottom:18px}.quick input{flex:1;background:transparent;border:0;outline:0;font-size:14px;min-width:0;padding:9px 0}.quick .primary{padding:9px 14px;min-height:39px}.quick:focus-within{border-color:#b3cfbf}.task-list-panel{padding-top:7px;padding-bottom:12px}
.tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 15px;flex-wrap:wrap}.seg{display:flex;gap:3px;align-items:center;border-radius:11px;padding:4px;background:#edf2ed}.seg button{font-size:12px;border-radius:8px;padding:8px 12px;font-weight:760;color:var(--muted)}.seg button.active{color:var(--green-deep);background:#fff;box-shadow:0 1px 4px #132b2012}.filters{display:flex;gap:12px;align-items:center}.filter-select{max-width:180px;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;font-size:12px;color:var(--ink)}.inline-checkbox{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}.inline-checkbox input{accent-color:var(--green)}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quadrant{min-height:190px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.quad-title{font-size:13px;font-weight:790;margin:0 0 5px}.quad-sub{font-size:11px;color:var(--muted);margin:0 0 11px}.matrix-item{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px solid var(--line)}.matrix-item:first-of-type{border-top:0}.matrix-item button:not(.check-circle){padding:1px 0;text-align:left;font-size:12px;line-height:1.45;overflow-wrap:anywhere}.matrix-blank{font-size:12px;color:var(--muted);padding:12px 0}.unclassified{margin-top:18px}
.empty-state{padding:37px 18px;background:#fff;border:1px dashed #d7e6db;border-radius:16px;text-align:center}.empty-state strong{display:block;margin-bottom:6px}.empty-state p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 17px}
.bottom-nav{display:none}.toast{position:fixed;z-index:90;bottom:30px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:.2s;background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-size:12px;white-space:nowrap;box-shadow:0 8px 28px #15271d33}.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-veil{position:fixed;inset:0;background:rgba(15,28,21,.32);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;border-radius:23px 23px 0 0;width:100%;max-width:650px;max-height:min(92vh,900px);max-height:min(92dvh,900px);display:flex;flex-direction:column;box-shadow:0 0 45px #0002}.sheet-head{padding:21px 23px 15px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;border-bottom:1px solid var(--line)}.sheet-head strong{font-size:18px;letter-spacing:-.2px}.close-btn{padding:5px;color:var(--muted)}.sheet-form{min-height:0;display:flex;flex:1;flex-direction:column}.sheet-body{overflow-y:auto;padding:22px 23px 24px;flex:1;overscroll-behavior:contain}.sheet-footer{padding:13px 23px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center;gap:15px}.sheet-footer .primary{padding:13px 24px;min-width:110px}.danger-link{font-size:12px;color:#b06760;padding:8px 0}.fieldbox{margin-bottom:20px}.fieldbox>label,.fieldbox>.label{display:block;font-size:12px;font-weight:750;margin-bottom:8px}.text-input,.textarea,.select{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #dae4dc;background:#fff;font-size:14px;color:var(--ink)}.text-input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px #e5f2e9}.textarea{resize:vertical;min-height:94px;line-height:1.6}.form-note{font-size:12px;color:var(--muted);line-height:1.6;margin:7px 0 0}.mini-status{margin-bottom:16px}.mini-status label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}.mini-status input{accent-color:var(--green)}
.more-details{border-top:1px solid var(--line);margin-top:13px;padding:15px 0 0}.more-details summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:750;color:var(--ink);padding:3px 0 5px}.more-details summary::-webkit-details-marker{display:none}.more-details summary span{color:var(--muted);font-size:11px;font-weight:500}.more-details[open] summary .chev{transform:rotate(90deg)}.more-content{padding:17px 0 3px}.select-list{display:grid;gap:8px}.select-option{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:9px;background:var(--soft);font-size:13px;line-height:1.45}.select-option input{accent-color:var(--green);margin:2px 0 0}.select-option small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.check-row{display:flex;gap:7px;align-items:center;margin-bottom:8px}.check-row>input[type=checkbox]{accent-color:var(--green)}.check-row>.text-input{flex:1}.remove-check{font-size:18px;color:var(--muted);padding:5px}.add-check{font-size:12px;color:var(--green);font-weight:750;margin-top:4px}.context-summary{margin:-6px 0 19px;color:var(--muted);font-size:12px;line-height:1.6}
@media(min-width:700px){.goal-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.goal-card{min-width:0}.shell{max-width:880px}.detail-content{max-width:750px}.sheet{border-radius:20px;max-height:85vh}.sheet-veil{align-items:center;padding:22px}}
@media(max-width:699px){.app{padding-bottom:calc(82px + env(safe-area-inset-bottom))}.topbar{height:58px;padding:0 20px}.brand{font-size:18px}.brandmark{width:27px;height:27px}.desktop-nav{display:none}.shell{padding:24px 17px 34px}.intro{margin-bottom:19px}.intro h1{font-size:26px}.intro p{font-size:12px;line-height:1.6}.intro .primary{font-size:12px;padding:10px 11px}.goal-card{padding:18px 17px}.goal-open strong{font-size:17px}.goal-meta{font-size:11px}.goal-head{gap:8px}.add-sm{padding:8px 9px;font-size:12px}.goal-preview{margin-top:14px;padding-top:10px}.taskline{padding:10px 0}.taskline-name{font-size:13px}.panel{padding:18px 17px}.detail-title{font-size:24px}.detail-back{margin-bottom:20px}.detail-edit{font-size:12px}.quick{margin-bottom:14px}.tools{align-items:flex-start}.filters{gap:9px}.filter-select{max-width:147px}.matrix{gap:9px}.quadrant{padding:12px 10px;min-height:160px}.quad-title{font-size:12px}.quad-sub{font-size:10px}.matrix-item{gap:6px;padding:8px 0}.matrix-item button:not(.check-circle){font-size:11px}.matrix-item .check-circle{height:18px;width:18px;flex-basis:18px}.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;height:calc(66px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);align-items:center;justify-content:center}.bottom-nav button{width:50%;height:100%;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:12px;font-weight:740}.bottom-nav button.active{color:var(--green)}.bottom-nav .icon{width:20px;height:20px}.toast{bottom:calc(79px + env(safe-area-inset-bottom))}.sheet-head{padding:18px 18px 13px}.sheet-body{padding:19px 18px 20px}.sheet-footer{padding:12px 18px calc(12px + env(safe-area-inset-bottom))}.sheet{max-height:92dvh}}
@media(max-width:360px){.intro{align-items:flex-start}.goal-head{flex-wrap:wrap}.add-sm{margin-left:auto}.two-fields{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4-.9L19.5 7.5a2 2 0 0 0-3-3L5 16Z"/></symbol>
</svg>
<div id="app"></div><div id="modal"></div><div id="toast" class="toast" aria-live="polite" role="status"></div>
<script>
(()=>{'use strict';
const KEY='goalpath-ux-prototype-v1';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const sample=()=>({goals:[
  {id:'g1',title:'自分のアプリを公開する',description:'使いやすい試作品をつくり、実際に公開する',deadline:'',status:'active'},
  {id:'g2',title:'SNSで認知を広げる',description:'制作の過程や学びを発信する',deadline:'',status:'active'},
  {id:'g3',title:'暮らしを便利にする',description:'毎日の手間を少しずつ減らす',deadline:'',status:'active'}],
  objectives:[
  {id:'o1',title:'試作品を完成させる',description:'まず自分が使える状態にする',goalIds:['g1'],status:'active'},
  {id:'o2',title:'利用者の声を集める',description:'使いづらいところを見つける',goalIds:['g1','g2'],status:'active'},
  {id:'o3',title:'発信を継続する',description:'小さな進捗を発信する',goalIds:['g2'],status:'active'},
  {id:'o4',title:'玄関を使いやすくする',description:'日々の忘れ物を減らす',goalIds:['g3'],status:'active'}],
  tasks:[
  {id:'t1',title:'画面構成を決める',note:'ゴールからタスクまで迷わず辿れる画面にする',goalIds:[],objectiveIds:['o1'],when:'today',importance:'must',plannedDate:today(),dueDate:'',done:true,checklist:[]},
  {id:'t2',title:'UIを実際に触って確認する',note:'登録→一覧→編集→マトリクスの動線を確認',goalIds:[],objectiveIds:['o1'],when:'today',importance:'must',plannedDate:today(),dueDate:'',done:false,checklist:[]},
  {id:'t3',title:'紹介動画の構成を考える',note:'複数のゴールに関連する例',goalIds:[],objectiveIds:['o2','o3'],when:'today',importance:'optional',plannedDate:today(),dueDate:'',done:false,checklist:[]},
  {id:'t4',title:'テスター3人に使ってもらう',note:'',goalIds:[],objectiveIds:['o2'],when:'later',importance:'must',plannedDate:'',dueDate:'',done:false,checklist:[]},
  {id:'t5',title:'投稿内容を整理する',note:'',goalIds:[],objectiveIds:['o3'],when:'later',importance:'optional',plannedDate:'',dueDate:'',done:false,checklist:[]},
  {id:'t6',title:'玄関ボードのアイデアを書く',note:'',goalIds:[],objectiveIds:['o4'],when:'',importance:'',plannedDate:'',dueDate:'',done:false,checklist:[]}]});
function read(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.goals)&&Array.isArray(v.objectives)&&Array.isArray(v.tasks))return v;}catch(e){}return sample();}
let data=read();
const ui={tab:'goals',goalId:null,objId:null,inlineGoal:null,mode:'list',filter:'all',showDone:false,modal:null};
let timer;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,cl='')=>`<svg class="icon ${cl}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const uuid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const findGoal=id=>data.goals.find(g=>g.id===id);
const findObj=id=>data.objectives.find(o=>o.id===id);
const findTask=id=>data.tasks.find(t=>t.id===id);
const taskGoals=t=>[...new Set([...(t.goalIds||[]),...(t.objectiveIds||[]).flatMap(id=>findObj(id)?.goalIds||[])])].filter(id=>!!findGoal(id));
const goalTasks=id=>data.tasks.filter(t=>taskGoals(t).includes(id));
const objectiveTasks=id=>data.tasks.filter(t=>(t.objectiveIds||[]).includes(id));
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){notice('ブラウザに保存できませんでした');}}
function notice(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),2200);}
function addTask(title,{goalId=null,objId=null}={}){const t={id:uuid('t'),title,note:'',goalIds:goalId?[goalId]:[],objectiveIds:objId?[objId]:[],when:'',importance:'',plannedDate:'',dueDate:'',done:false,checklist:[]};data.tasks.unshift(t);save();return t;}
function statusChip(s){return s==='done'?'<span class="status-mini done">達成済み</span>':s==='paused'?'<span class="status-mini">一時停止</span>':'';}
function taskLine(t,{showGoal=true,showObj=true}={}){const gids=taskGoals(t).map(id=>findGoal(id)?.title).filter(Boolean);const objectives=(t.objectiveIds||[]).map(id=>findObj(id)?.title).filter(Boolean);const sub=[showGoal?(gids.length?gids.slice(0,2).join('・')+(gids.length>2?' ほか':''):'ゴール未設定'):'',showObj&&objectives.length?`目標：${objectives.slice(0,2).join('・')}${objectives.length>2?' ほか':''}`:''].filter(Boolean).join('　/　');return `<div class="taskline"><button class="check-circle ${t.done?'done':''}" data-act="task-toggle" data-id="${esc(t.id)}" aria-label="${t.done?'未完了に戻す':'完了する'}：${esc(t.title)}">${t.done?icon('check','sm'):''}</button><div class="taskline-body"><button class="taskline-name ${t.done?'done':''}" data-act="task-edit" data-id="${esc(t.id)}">${esc(t.title)}</button>${sub?`<span class="taskline-sub">${esc(sub)}</span>`:''}</div></div>`;}
function inlineForm(goalId,objectiveId=null,permanent=false){const ident=objectiveId?`o_${objectiveId}`:`g_${goalId}`;return `<form class="inline-add ${permanent?'permanent':''}" data-form="goal-task" data-goal="${esc(goalId)}" data-objective="${esc(objectiveId||'')}"><input class="field" name="title" id="task-${esc(ident)}" placeholder="タスク名を入力" aria-label="タスク名" maxlength="150" required autocomplete="off"><button type="submit" class="primary">追加</button></form>`;}
function goalCard(g){const ts=goalTasks(g.id),unfinished=ts.filter(t=>!t.done),done=ts.length-unfinished.length,objs=data.objectives.filter(o=>(o.goalIds||[]).includes(g.id)),preview=unfinished.slice(0,2),showInline=ui.inlineGoal===g.id;return `<article class="goal-card"><div class="goal-head"><button class="goal-open" data-act="goal-open" data-id="${esc(g.id)}"><strong>${esc(g.title)}${statusChip(g.status)}</strong><p class="goal-meta">目標 ${objs.length}件 ・ タスク ${done}/${ts.length}件完了</p></button><button class="add-sm" data-act="inline-goal" data-id="${esc(g.id)}" aria-expanded="${showInline}" aria-label="${esc(g.title)}にタスク追加">${icon('plus','sm')} タスク</button></div>${showInline?inlineForm(g.id):''}<div class="goal-preview">${preview.length?preview.map(t=>taskLine(t,{showGoal:false,showObj:false})).join(''):`<div class="empty-note">${ts.length?'未完了のタスクはありません':'まずタスクを追加してみましょう'}</div>`}<div class="peek-more"><button class="plain-action" data-act="goal-open" data-id="${esc(g.id)}">${unfinished.length>2?`残り${unfinished.length-2}件を見る`:'ゴールを開く'} ${icon('arrow','sm')}</button></div></div></article>`;}
function renderGoals(){return `<div class="intro"><div><h1>ゴール</h1><p>達成したいことから、タスクを整理。</p></div><button class="primary" data-act="new-goal">${icon('plus','sm')} ゴール追加</button></div>${data.goals.length?`<div class="goal-list">${data.goals.map(goalCard).join('')}</div>`:`<div class="empty-state"><strong>まだゴールがありません</strong><p>まずは達成したいことを1つ作りましょう。</p><button class="primary" data-act="new-goal">${icon('plus','sm')} ゴールをつくる</button></div>`}`;}
function renderGoalDetail(){const g=findGoal(ui.goalId);if(!g){ui.goalId=null;return renderGoals();}const ts=goalTasks(g.id),open=ts.filter(t=>!t.done),done=ts.filter(t=>t.done),objs=data.objectives.filter(o=>(o.goalIds||[]).includes(g.id));return `<button class="detail-back" data-act="back-goals">${icon('left','sm')} ゴール一覧</button><div class="detail-title-row"><div><h1 class="detail-title">${esc(g.title)}${statusChip(g.status)}</h1>${g.description?`<p class="detail-description">${esc(g.description)}</p>`:''}<p class="detail-meta">タスク ${done.length}/${ts.length}件完了 ・ 目標 ${objs.length}件</p></div><button class="ghost detail-edit" data-act="goal-edit" data-id="${esc(g.id)}">${icon('edit','sm')} 編集</button></div><div class="detail-content"><section class="panel"><div class="section-head"><h2>タスク</h2><span class="link-muted">${open.length}件 未完了</span></div>${inlineForm(g.id,null,true)}<div class="simple-list">${open.map(t=>taskLine(t,{showGoal:false,showObj:true})).join('')}${done.map(t=>taskLine(t,{showGoal:false,showObj:true})).join('')}</div>${!ts.length?'<p class="section-hint">追加したタスクは、このゴールに自動で紐づきます。</p>':''}</section><section class="panel"><details class="section-detail"><summary><span>目標 <span class="status-mini" style="background:var(--soft);color:var(--muted)">${objs.length}件</span></span><span class="summary-side">必要なときに見る ${icon('chevron','chev sm')}</span></summary><div style="margin-top:14px">${objs.map(o=>`<div class="objective-row"><button data-act="obj-open" data-id="${esc(o.id)}"><strong>${esc(o.title)}${(o.goalIds||[]).length>1?' <span>（複数ゴール）</span>':''}</strong><span>関連タスク ${objectiveTasks(o.id).filter(t=>t.done).length}/${objectiveTasks(o.id).length}件完了</span></button><button class="objective-add" data-act="new-task" data-goal="${esc(g.id)}" data-objective="${esc(o.id)}">＋ タスク</button></div>`).join('')}${!objs.length?'<p class="empty-note">目標はまだありません。なくてもタスクを追加できます。</p>':''}<button class="plain-action" data-act="new-obj" data-goal="${esc(g.id)}">${icon('plus','sm')} 目標を追加</button></div></details></section></div>`;}
function renderObjDetail(){const o=findObj(ui.objId);if(!o){ui.objId=null;return renderGoalDetail();}const ts=objectiveTasks(o.id),parent=findGoal(ui.goalId)||findGoal(o.goalIds?.[0]);const open=ts.filter(t=>!t.done),done=ts.filter(t=>t.done);return `<button class="detail-back" data-act="back-obj">${icon('left','sm')} ${esc(parent?.title||'ゴール')}</button><div class="detail-title-row"><div><p class="detail-meta" style="margin:0 0 5px">目標</p><h1 class="detail-title">${esc(o.title)}${statusChip(o.status)}</h1>${o.description?`<p class="detail-description">${esc(o.description)}</p>`:''}<p class="detail-meta">タスク ${done.length}/${ts.length}件完了</p></div><button class="ghost detail-edit" data-act="obj-edit" data-id="${esc(o.id)}">${icon('edit','sm')} 編集</button></div><div class="detail-content"><section class="panel"><div class="section-head"><h2>この目標のタスク</h2></div>${inlineForm(parent?.id||o.goalIds?.[0]||'',o.id,true)}<div class="simple-list">${open.concat(done).map(t=>taskLine(t,{showGoal:true,showObj:false})).join('')}</div></section></div>`;}
function taskFilter(t){return (ui.filter==='all'||taskGoals(t).includes(ui.filter))&&(ui.showDone||!t.done);}
function renderTasks(){const relevant=data.tasks.filter(taskFilter);return `<div class="intro"><div><h1>タスク</h1><p>やることを、ひとつずつ。</p></div></div><form data-form="general-task" class="quick"><span style="color:var(--green)">${icon('plus')}</span><input name="title" placeholder="タスクをすぐ追加" aria-label="タスク名" maxlength="150" required autocomplete="off"><button class="primary" type="submit">追加</button></form><div class="tools"><div class="seg"><button class="${ui.mode==='list'?'active':''}" data-act="mode" data-mode="list">一覧</button><button class="${ui.mode==='matrix'?'active':''}" data-act="mode" data-mode="matrix">4象限</button></div><div class="filters"><select class="filter-select" aria-label="ゴールで絞り込む" data-change="filter"><option value="all">すべてのゴール</option>${data.goals.map(g=>`<option value="${esc(g.id)}" ${ui.filter===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}</select><label class="inline-checkbox"><input type="checkbox" data-change="showDone" ${ui.showDone?'checked':''}>完了も表示</label></div></div>${ui.mode==='matrix'?renderMatrix(relevant):`<div class="panel task-list-panel">${relevant.length?relevant.map(t=>taskLine(t,{showGoal:true,showObj:true})).join(''):'<div class="empty-note">表示するタスクはありません。</div>'}</div>`}`;}
function renderMatrix(relevant){const zones=[['today','must','今日・必須'],['later','must','後日・必須'],['today','optional','今日・任意'],['later','optional','後日・保留']];return `<div class="matrix">${zones.map(([when,importance,label])=>{const ts=relevant.filter(t=>t.when===when&&t.importance===importance);return `<section class="quadrant"><h2 class="quad-title">${label}</h2><p class="quad-sub">${ts.length}件</p>${ts.length?ts.map(t=>`<div class="matrix-item"><button class="check-circle ${t.done?'done':''}" data-act="task-toggle" data-id="${esc(t.id)}" aria-label="${esc(t.title)}を完了">${t.done?icon('check','sm'):''}</button><button data-act="task-edit" data-id="${esc(t.id)}">${esc(t.title)}</button></div>`).join(''):'<div class="matrix-blank">タスクなし</div>'}</section>`}).join('')}</div>${relevant.some(t=>!t.when||!t.importance)?`<section class="panel unclassified"><div class="section-head"><h2>未分類</h2></div>${relevant.filter(t=>!t.when||!t.importance).map(t=>taskLine(t,{showGoal:true,showObj:false})).join('')}</section>`:''}`;}
function render(){const content=ui.objId?renderObjDetail():ui.goalId?renderGoalDetail():ui.tab==='goals'?renderGoals():renderTasks();document.getElementById('app').innerHTML=`<div class="app"><header class="topbar"><div class="brand"><span class="brandmark">↗</span>Goalpath</div><nav class="desktop-nav"><button data-act="tab" data-tab="goals" class="${ui.tab==='goals'?'active':''}">ゴール</button><button data-act="tab" data-tab="tasks" class="${ui.tab==='tasks'?'active':''}">タスク</button></nav></header><main class="shell">${content}</main><nav class="bottom-nav" aria-label="メインメニュー"><button data-act="tab" data-tab="goals" class="${ui.tab==='goals'?'active':''}">${icon('target')} ゴール</button><button data-act="tab" data-tab="tasks" class="${ui.tab==='tasks'?'active':''}">${icon('list')} タスク</button></nav></div>`;}
function field(label,name,value='',opts=''){return `<div class="fieldbox"><label for="edit-${name}">${label}</label><input class="text-input" id="edit-${name}" name="${name}" value="${esc(value)}" ${opts}></div>`;}
function options(kind,selected){const arr=kind==='goalIds'?data.goals:data.objectives;return arr.length?`<div class="select-list">${arr.map(x=>`<label class="select-option"><input type="checkbox" name="${kind}" value="${esc(x.id)}" ${selected.includes(x.id)?'checked':''}><span>${esc(x.title)}${kind==='objectiveIds'&&(x.goalIds||[]).length>0?`<small>${esc(x.goalIds.map(id=>findGoal(id)?.title).filter(Boolean).join('・'))}</small>`:''}</span></label>`).join('')}</div>`:'<p class="form-note">まだ登録がありません。</p>';}
const statusSelect=s=>`<select class="select" name="status"><option value="active" ${s==='active'?'selected':''}>進行中</option><option value="done" ${s==='done'?'selected':''}>達成済み</option><option value="paused" ${s==='paused'?'selected':''}>一時停止</option></select>`;
function checkRow(item={text:'',done:false}){return `<div class="check-row"><input type="checkbox" ${item.done?'checked':''} aria-label="チェック項目完了"><input class="text-input" name="checkText" value="${esc(item.text)}" placeholder="小さな手順" maxlength="150" aria-label="チェック項目名"><button type="button" class="remove-check" data-act="remove-check" aria-label="項目を削除">×</button></div>`;}
function renderEditor(){const holder=document.getElementById('modal');if(!ui.modal){holder.innerHTML='';document.body.style.overflow='';return;}document.body.style.overflow='hidden';const {type,id,context={}}=ui.modal;const obj=type==='goal'?findGoal(id):type==='objective'?findObj(id):findTask(id);const editing=!!obj;const draft=obj||{title:'',description:'',status:'active',deadline:'',goalIds:context.goalId?[context.goalId]:[],objectiveIds:context.objId?[context.objId]:[],note:'',done:false,plannedDate:'',dueDate:'',when:'',importance:'',checklist:[]};const title=type==='goal'?'ゴール':type==='objective'?'目標':'タスク';let body=field(`${title}名`,'title',draft.title,'required maxlength="150" placeholder="名前を入力"');
if(type==='goal'){body+=`<details class="more-details" ${editing?'open':''}><summary>詳細設定 ${icon('chevron','chev sm')}</summary><div class="more-content"><div class="fieldbox"><label>説明（任意）</label><textarea name="description" class="textarea" placeholder="どんな状態を目指す？">${esc(draft.description)}</textarea></div><div class="two-fields"><div class="fieldbox"><label>達成状況</label>${statusSelect(draft.status)}</div><div class="fieldbox"><label>期限</label><input class="text-input" type="date" name="deadline" value="${esc(draft.deadline)}"></div></div></div></details>`;}
else if(type==='objective'){body+=`<p class="context-summary">関連するゴールを設定できます。複数のゴールとの共有も可能です。</p><details class="more-details" open><summary>関連するゴール ${icon('chevron','chev sm')}</summary><div class="more-content">${options('goalIds',draft.goalIds||[])}</div></details><details class="more-details"><summary>その他の設定 ${icon('chevron','chev sm')}</summary><div class="more-content"><div class="fieldbox"><label>説明（任意）</label><textarea class="textarea" name="description">${esc(draft.description)}</textarea></div><div class="fieldbox"><label>達成状況</label>${statusSelect(draft.status)}</div></div></details>`;}
else{const linked=taskGoals(draft).map(id=>findGoal(id)?.title).filter(Boolean);body+=`<p class="context-summary">${linked.length?`関連ゴール：${esc(linked.join('・'))}`:'ゴール未設定。追加後に関連付けできます。'}</p><div class="mini-status"><label><input type="checkbox" name="done" ${draft.done?'checked':''}> 完了済みにする</label></div><details class="more-details"><summary>ゴール・目標との関連付け <span>必要なときに設定 ${icon('chevron','chev sm')}</span></summary><div class="more-content"><div class="fieldbox"><span class="label">関連するゴール</span>${options('goalIds',draft.goalIds||[])}</div><div class="fieldbox"><span class="label">関連する目標</span>${options('objectiveIds',draft.objectiveIds||[])}</div></div></details><details class="more-details"><summary>日付・マトリクス・メモ <span>詳細を開く ${icon('chevron','chev sm')}</span></summary><div class="more-content"><div class="two-fields"><div class="fieldbox"><label>取り組む日</label><input class="text-input" type="date" name="plannedDate" value="${esc(draft.plannedDate)}"></div><div class="fieldbox"><label>締め切り</label><input class="text-input" type="date" name="dueDate" value="${esc(draft.dueDate)}"></div></div><div class="two-fields"><div class="fieldbox"><label>いつ</label><select name="when" class="select"><option value="">未設定</option><option value="today" ${draft.when==='today'?'selected':''}>今日</option><option value="later" ${draft.when==='later'?'selected':''}>後日</option></select></div><div class="fieldbox"><label>必要性</label><select name="importance" class="select"><option value="">未設定</option><option value="must" ${draft.importance==='must'?'selected':''}>必須</option><option value="optional" ${draft.importance==='optional'?'selected':''}>任意</option></select></div></div><div class="fieldbox"><label>メモ</label><textarea class="textarea" name="note" placeholder="必要なときだけ書く">${esc(draft.note)}</textarea></div><div class="fieldbox"><span class="label">チェックリスト</span><div id="check-rows">${(draft.checklist||[]).map(checkRow).join('')}</div><button type="button" class="add-check" data-act="add-check">＋ 項目を追加</button></div></div></details>`;}
const html=`<div class="sheet-veil" id="veil"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><strong id="sheet-title">${editing?`${title}を編集`:`${title}を追加`}</strong><button class="close-btn" data-act="close" aria-label="閉じる">${icon('x')}</button></div><form class="sheet-form" id="editor-form" data-type="${type}" data-id="${esc(id||'')}"><div class="sheet-body">${body}</div><div class="sheet-footer">${editing?`<button type="button" class="danger-link" data-act="delete" data-type="${type}" data-id="${esc(id)}">削除</button>`:'<span></span>'}<button type="submit" class="primary">${editing?'保存する':'追加する'}</button></div></form></div></div>`;
holder.innerHTML=html;holder.querySelector('input[name=title]')?.focus({preventScroll:true});}
function openEditor(type,id=null,context={}){ui.modal={type,id,context};renderEditor();}
function closeEditor(){ui.modal=null;renderEditor();}
function saveEditor(form){const fd=new FormData(form);const {type,id}=form.dataset;const title=String(fd.get('title')||'').trim();if(!title){notice('名前を入力してください');return;}const ids=n=>fd.getAll(n).map(String);const existing=type==='goal'?findGoal(id):type==='objective'?findObj(id):findTask(id);let next;
if(type==='goal'){next={...(existing||{}),id:id||uuid('g'),title,description:String(fd.get('description')||''),status:String(fd.get('status')||'active'),deadline:String(fd.get('deadline')||'')};if(existing)Object.assign(existing,next);else data.goals.push(next);}
else if(type==='objective'){next={...(existing||{}),id:id||uuid('o'),title,description:String(fd.get('description')||''),status:String(fd.get('status')||'active'),goalIds:ids('goalIds')};if(existing)Object.assign(existing,next);else data.objectives.push(next);}
else{const checks=[...form.querySelectorAll('.check-row')].map(row=>({text:row.querySelector('input[name=checkText]')?.value.trim()||'',done:row.querySelector('input[type=checkbox]')?.checked||false})).filter(x=>x.text);next={...(existing||{}),id:id||uuid('t'),title,note:String(fd.get('note')||''),done:fd.get('done')==='on',goalIds:ids('goalIds'),objectiveIds:ids('objectiveIds'),when:String(fd.get('when')||''),importance:String(fd.get('importance')||''),plannedDate:String(fd.get('plannedDate')||''),dueDate:String(fd.get('dueDate')||''),checklist:checks};if(existing)Object.assign(existing,next);else data.tasks.unshift(next);}
save();closeEditor();render();notice(editingLabel(type,id));}
function editingLabel(type,id){return `${type==='goal'?'ゴール':type==='objective'?'目標':'タスク'}を${id?'保存':'追加'}しました`;}
function deleteEntity(type,id){const label=type==='goal'?'ゴール':type==='objective'?'目標':'タスク';if(!confirm(`${label}を削除しますか？\n関連するほかの項目は残ります。`))return;if(type==='goal'){data.goals=data.goals.filter(g=>g.id!==id);data.objectives.forEach(o=>o.goalIds=(o.goalIds||[]).filter(v=>v!==id));data.tasks.forEach(t=>t.goalIds=(t.goalIds||[]).filter(v=>v!==id));if(ui.goalId===id){ui.goalId=null;ui.objId=null;}if(ui.filter===id)ui.filter='all';}
else if(type==='objective'){data.objectives=data.objectives.filter(o=>o.id!==id);data.tasks.forEach(t=>t.objectiveIds=(t.objectiveIds||[]).filter(v=>v!==id));if(ui.objId===id)ui.objId=null;}
else data.tasks=data.tasks.filter(t=>t.id!==id);save();closeEditor();render();notice(`${label}を削除しました`);}
function handleClick(target){const e=target.closest('[data-act]');if(!e)return;const a=e.dataset.act,id=e.dataset.id;switch(a){case'tab':ui.tab=e.dataset.tab;ui.goalId=null;ui.objId=null;ui.inlineGoal=null;render();window.scrollTo(0,0);break;
case'goal-open':ui.tab='goals';ui.goalId=id;ui.objId=null;ui.inlineGoal=null;render();window.scrollTo(0,0);break;
case'back-goals':ui.tab='goals';ui.goalId=null;ui.objId=null;ui.inlineGoal=null;render();break;
case'obj-open':ui.objId=id;render();window.scrollTo(0,0);break;
case'back-obj':ui.objId=null;render();break;
case'inline-goal':ui.inlineGoal=ui.inlineGoal===id?null:id;render();document.getElementById('task-g_'+id)?.focus();break;
case'new-goal':openEditor('goal');break;case'goal-edit':openEditor('goal',id);break;
case'new-obj':openEditor('objective',null,{goalId:e.dataset.goal});break;
case'obj-edit':openEditor('objective',id);break;
case'new-task':openEditor('task',null,{goalId:e.dataset.goal||null,objId:e.dataset.objective||null});break;
case'task-edit':openEditor('task',id);break;
case'task-toggle':{const t=findTask(id);if(!t)return;t.done=!t.done;save();render();notice(t.done?'タスクを完了しました':'未完了に戻しました');break;}
case'mode':ui.mode=e.dataset.mode;render();break;
case'close':closeEditor();break;
case'delete':deleteEntity(e.dataset.type,id);break;
case'add-check':e.closest('.fieldbox')?.querySelector('#check-rows')?.insertAdjacentHTML('beforeend',checkRow());break;
case'remove-check':e.closest('.check-row')?.remove();break;
}}
document.addEventListener('click',e=>{if(e.target.id==='veil'){closeEditor();return;}handleClick(e.target);});
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='editor-form'){e.preventDefault();saveEditor(f);return;}const kind=f.dataset.form;if(!kind)return;e.preventDefault();const value=f.querySelector('input[name=title]')?.value.trim();if(!value)return;if(kind==='goal-task'){addTask(value,{goalId:f.dataset.goal||null,objId:f.dataset.objective||null});const focusId=f.querySelector('input[name=title]')?.id;render();if(focusId)document.getElementById(focusId)?.focus();notice('タスクを追加しました');}else if(kind==='general-task'){addTask(value);render();document.querySelector('.quick input')?.focus();notice('タスクを追加しました');}});
document.addEventListener('change',e=>{switch(e.target.dataset.change){case'filter':ui.filter=e.target.value;render();break;case'showDone':ui.showDone=e.target.checked;render();break;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){closeEditor();}});
render();
})();

</script>
</body>
</html>
